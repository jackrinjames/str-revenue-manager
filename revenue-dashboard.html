/* ---------- ALOS and booking window ----------
   Computed from reservation-level rows, which carry no_of_days (length of stay)
   and lead_time (days between booking and check-in). Fetched on demand because
   it's a separate call and only the scorecard needs it. */
async function loadStays(id){
  const u=byId(id), box=document.getElementById('stays-'+id);
  if(box) box.innerHTML='<div class="note">Pulling reservation history…</div>';
  try{
    const t=new Date();
    const from=new Date(t.getTime()-540*864e5), to=new Date(t.getTime()+400*864e5);
    const r=await call('get_bookings_report',{question:'length of stay and booking window',
      date_filters:{min_check_in_date:iso(from),max_check_in_date:iso(to)},
      filters:{listings:[{listing_id:u.id,pms_name:u.pms}]},limit:500});
    u.stays=(r.data?.data?.reservations||[]).filter(x=>x.status==='booked');
    renderStays(id);
  }catch(e){
    if(box) box.innerHTML=`<div class="err">Couldn't load reservation history: ${esc(e.message)}</div>`;
  }
}
function staysStats(rows){
  if(!rows||!rows.length) return null;
  const los=rows.map(r=>Number(r.no_of_days)).filter(n=>n>0);
  const lead=rows.map(r=>Number(r.lead_time)).filter(n=>n>=0);
  const mean=a=>a.length?a.reduce((s,n)=>s+n,0)/a.length:null;
  const med=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;
    return b.length%2?b[m]:(b[m-1]+b[m])/2;};
  const buckets=[[1,1,'1 night'],[2,2,'2 nights'],[3,4,'3–4'],[5,7,'5–7'],[8,999,'8+']];
  const dist=buckets.map(([lo,hi,label])=>({label,n:los.filter(x=>x>=lo&&x<=hi).length}));
  const bySrc={};
  rows.forEach(r=>{const k=r.booking_source||'other';(bySrc[k]=bySrc[k]||[]).push(r)});
  return {n:rows.length,alos:mean(los),alosMed:med(los),lead:mean(lead),leadMed:med(lead),
    sameDay:lead.filter(x=>x===0).length,dist,
    bySrc:Object.entries(bySrc).map(([k,v])=>({src:k,n:v.length,
      alos:mean(v.map(x=>Number(x.no_of_days)).filter(n=>n>0)),
      adr:mean(v.map(x=>Number(x.nightly_amount)).filter(n=>n>0))})).sort((a,b)=>b.n-a.n)};
}
function renderStays(id){
  const u=byId(id), box=document.getElementById('stays-'+id); if(!box) return;
  const s=staysStats(u.stays);
  if(!s){ box.innerHTML='<div class="note">No booked reservations in the window.</div>'; return; }
  const C=cfgFor(u);
  const maxN=Math.max(...s.dist.map(d=>d.n),1);
  const shortShare=Math.round((s.dist[0].n+s.dist[1].n)/s.n*100);
  return box.innerHTML=`<div class="card" style="margin-top:12px">
    <div class="chead"><div><h2>Stays &amp; booking window</h2>
      <div class="tiny muted">${s.n} booked reservations</div></div></div>
    <div class="grid">
      <div class="cell"><div class="k">${tip('alos','ALOS')}</div><div class="v bignum">${s.alos.toFixed(1)}</div>
        <div class="n">median ${s.alosMed} night${s.alosMed===1?'':'s'}</div></div>
      <div class="cell"><div class="k">${tip('bwin','Booking window')}</div><div class="v bignum">${s.lead.toFixed(0)}d</div>
        <div class="n">median ${s.leadMed}d${s.sameDay?` · ${s.sameDay} same-day`:''}</div></div>
      <div class="cell ${shortShare>50?'s-warn':''}"><div class="k">1–2 night stays</div><div class="v bignum">${shortShare}%</div>
        <div class="n">of all bookings</div></div>
    </div>
    <h3>Length of stay</h3>
    <div class="scroll"><table><tbody>${s.dist.map(d=>`<tr>
      <td style="width:80px">${d.label}</td>
      <td><div style="background:#18181b;height:14px;border-radius:3px;width:${Math.round(d.n/maxN*100)}%;min-width:${d.n?'6px':'0'}"></div></td>
      <td class="r bignum" style="width:70px">${d.n}${d.n?` <span class="muted tiny">${Math.round(d.n/s.n*100)}%</span>`:''}</td>
    </tr>`).join('')}</tbody></table></div>
    <h3>By channel</h3>
    <div class="scroll"><table><thead><tr><th>Source</th><th class="r">Bookings</th><th class="r">ALOS</th><th class="r">ADR</th></tr></thead>
    <tbody>${s.bySrc.map(x=>`<tr><td>${esc(x.src)}</td><td class="r bignum">${x.n}</td>
      <td class="r bignum">${x.alos!=null?x.alos.toFixed(1):'—'}</td>
      <td class="r bignum">${x.adr!=null?money(x.adr):'—'}</td></tr>`).join('')}</tbody></table></div>
    <div class="note">${shortShare>50
      ? `Over half your bookings are 1–2 nights. Short stays cost more per booking in turnover and cleaning, so a minimum-stay rise on strong dates may lift RevPAN even if it costs a little occupancy — but check the minimum isn't already blocking longer stays first.`
      : `Your stay mix is reasonably long, which keeps turnover costs down. Be careful raising minimums further; the gain in ALOS may cost more occupancy than it's worth.`}
      Median booking window is ${s.leadMed} days — the ${s.leadMed<=7?'near window is where almost everything happens, so far-out gaps are normal rather than alarming':'market books far enough ahead that a soft far window is a genuine signal'}.</div>
  </div>`;
}

/* ---------- RevPAN scorecard ----------
   Pace tells you what to do next; RevPAN tells you whether the last round of
   decisions made money. They answer different questions and both are needed —
   high occupancy with collapsing ADR reads as a win on pace alone.

   PriceLabs does not publish market ADR or market RevPAN, only market
   occupancy, so "beat the market's RevPAN" isn't computable here. What is
   available: your own RevPAN forward, trailing, and same time last year. */
/* Market RevPAN = market occupancy × market ADR. PriceLabs' metrics endpoint
   publishes market occupancy but not market ADR; the comp-set median asking
   price from the neighbourhood call stands in for it. Checked against the
   Market Dashboard's own published figure it lands within a fraction of a
   percent, but it remains an asking-price proxy rather than achieved ADR. */
/* RevPAN index for a window, plus whether your rate is already under the comp
   set. Both are needed: a low index caused by weak rate calls for the opposite
   move to a low index caused by weak occupancy. */
function revPicture(u,w){
  const d=snapDFD(w.to);
  const adr=marketAdr(u), mkOcc=u.mkt?.[d], mine=u.revpar?.[d];
  if(adr==null||mkOcc==null||mine==null) return null;
  const mRev=adr*mkOcc/100;
  if(!mRev) return null;
  return {idx:mine/mRev, adrBelow:(u.adr?.[d]!=null)?u.adr[d]<adr:false};
}
function marketAdr(u){
  const t=(u.comp&&u.comp.table_data&&u.comp.table_data[0])||null;
  const med=t?Number(t['50_percentile_price']):Number(u.comp?.median_price);
  return isFinite(med)&&med>0?med:null;
}
function marketRevpan(u,dfd){
  const adr=marketAdr(u), occ=u.mkt?.[dfd];
  return (adr==null||occ==null)?null:adr*occ/100;
}

function revpanCard(u){
  const f30=u.revpar?.[30], f90=u.revpar?.[90];
  const t=u.trail||{}, y=u.year||{};
  if(f90==null&&t.revpar==null) return `<h3>${tip('revpan','RevPAN scorecard')}</h3>
    <div class="note">PriceLabs hasn't returned revenue figures for this listing. That normally means the metrics call failed,
    or the listing has too little booking history to compute RevPAN yet.
    <button class="stage" style="margin-left:6px" onclick="main()">Reload</button></div>`;

  const pct=(a,b)=>(a==null||b==null||!b)?null:Math.round((a-b)/b*100);
  const vsTrail=pct(f90,t.revpar);
  const mAdr=marketAdr(u);
  const mRev90=marketRevpan(u,90);
  const idx=(f90!=null&&mRev90)?f90/mRev90:null;

  // Which lever moved? RevPAN = occupancy × ADR, so compare both against trailing.
  const occD=pct(u.cum?.[90],t.occ), adrD=pct(u.adr?.[90],t.adr);
  let read='';
  if(vsTrail!=null){
    if(occD!=null&&adrD!=null){
      if(occD>5&&adrD<-5) read=`Occupancy is up ${occD}% on the trailing 90 days while rate is down ${Math.abs(adrD)}%. You are buying volume with rate — which is only a win if RevPAN holds, and here it ${vsTrail>=0?'does':'does not'}.`;
      else if(occD<-5&&adrD>5) read=`Rate is up ${adrD}% but occupancy is down ${Math.abs(occD)}%. Holding out for a higher price; RevPAN says that is ${vsTrail>=0?'working':'costing you'}.`;
      else if(occD<-5&&adrD<-5) read='Both occupancy and rate are below trailing. That is a demand or listing problem, not a pricing one — check the health diagnostics before touching price.';
      else if(occD>5&&adrD>5) read='Occupancy and rate are both ahead of trailing. Nothing to fix here.';
      else read='Occupancy and rate are both close to trailing; RevPAN is moving with the season rather than with your decisions.';
    }
  }

  const stlyRows=[30,90,180,360].map(d=>{
    const mine=u.revpar?.[d], last=u.stlyRevpar?.[d];
    if(mine==null) return '';
    const delta=pct(mine,last);
    const has=last!=null&&last>0;
    const mr=marketRevpan(u,d), ix=mr?mine/mr:null;
    return `<tr><td>Next ${d} days</td>
      <td class="r bignum">${money(mine)}</td>
      <td class="r bignum muted">${mr?money(mr):'—'}</td>
      <td class="r bignum ${ix==null?'muted':ix>=1?'s-good':ix>=0.85?'s-warn':'s-bad'}">${ix?ix.toFixed(2)+'×':'—'}</td>
      <td class="r bignum muted">${has?money(last):'—'}</td>
      <td class="r bignum ${!has?'muted':delta>=0?'s-good':'s-bad'}">${has?(delta>0?'+':'')+delta+'%':'—'}</td>
      <td class="r bignum muted">${u.cum?.[d]!=null?u.cum[d].toFixed(0)+'%':'—'}</td>
      <td class="r bignum muted">${u.adr?.[d]!=null?money(u.adr[d]):'—'}</td></tr>`;
  }).join('');

  const anyStly=[30,90,180,360].some(d=>u.stlyRevpar?.[d]>0);

  return `<h3>${tip('revpan','RevPAN scorecard')}</h3>
  <div class="grid">
    ${idx!=null?`<div class="cell ${idx>=1?'s-good':idx>=0.85?'s-warn':'s-bad'}">
      <div class="k">${tip('revpanIdx','RevPAN vs market')}</div><div class="v bignum">${idx.toFixed(2)}×</div>
      <div class="n">${money(f90)} vs market ${money(mRev90)}${idx<1?` — ${Math.round((1-idx)*100)}% behind`:` — ${Math.round((idx-1)*100)}% ahead`}</div></div>`:''}
    <div class="cell ${vsTrail==null?'':vsTrail>=0?'s-good':'s-bad'}">
      <div class="k">RevPAN next 90d</div><div class="v bignum">${f90!=null?money(f90):'—'}</div>
      <div class="n">${vsTrail!=null?`${vsTrail>0?'+':''}${vsTrail}% vs trailing 90d (${money(t.revpar)})`:'no trailing data'}</div></div>
    <div class="cell"><div class="k">RevPAN next 30d</div><div class="v bignum">${f30!=null?money(f30):'—'}</div>
      <div class="n">booked so far in the window</div></div>
    <div class="cell ${occD==null?'':occD>=0?'s-good':'s-warn'}"><div class="k">Occupancy lever</div>
      <div class="v bignum">${u.cum?.[90]!=null?u.cum[90].toFixed(0)+'%':'—'}</div>
      <div class="n">${occD!=null?`${occD>0?'+':''}${occD}% vs trailing`:''}</div></div>
    <div class="cell ${adrD==null?'':adrD>=0?'s-good':'s-warn'}"><div class="k">Rate lever</div>
      <div class="v bignum">${u.adr?.[90]!=null?money(u.adr[90]):'—'}</div>
      <div class="n">${adrD!=null?`${adrD>0?'+':''}${adrD}% vs trailing`:''}</div></div>
    <div class="cell"><div class="k">Trailing 12mo</div><div class="v bignum">${y.revpar!=null?money(y.revpar):'—'}</div>
      <div class="n">${y.adr!=null?`${money(y.adr)} ADR · ${y.occ!=null?y.occ.toFixed(0)+'%':''}`:''}</div></div>
  </div>
  ${read?`<div class="note" style="margin-top:-4px"><strong>What the composite says.</strong> ${esc(read)}</div>`:''}
  <div class="scroll"><table><thead><tr><th>Window</th><th class="r">Your RevPAN</th><th class="r">Market</th>
    <th class="r">Index</th><th class="r">Last yr</th><th class="r">Chg</th><th class="r">Occ</th><th class="r">ADR</th></tr></thead><tbody>${stlyRows}</tbody></table></div>
  ${anyStly?'':`<div class="note">No same-time-last-year figures yet — PriceLabs needs a full year of synced history before this column populates. Until then, judge against the trailing 90 days above.</div>`}
  ${mAdr?`<div class="note"><strong>How market RevPAN is derived.</strong> PriceLabs publishes market occupancy but not market ADR through this connector,
    so the comp set's median asking price (${money(mAdr)} across ${u.comp?.n_listings||'—'} ${esc(u.comp?.best_category||'')} listings) stands in for it.
    Checked against the figure on PriceLabs' own Market Dashboard the two agree closely, but it is an asking price rather than an achieved rate,
    so treat the index as a good approximation rather than an exact score.</div>`
    :(()=>{const st=u.enrich&&u.enrich.market;
       if(!st||st==='pending') return '<div class="note">Market RevPAN is still loading — it needs the comp-set price from the neighbourhood call.</div>';
       if(st==='ok') return '<div class="note">PriceLabs returned no comp-set pricing for this listing, so market RevPAN can\'t be derived. The figures above are still your own.</div>';
       return `<div class="note"><strong>Market RevPAN unavailable.</strong> The neighbourhood call failed: ${esc(String(st))}.
         Everything above is your own performance; only the market comparison is missing.
         <button class="stage" style="margin-left:6px" onclick="retryEnrich('${u.id}')">Retry</button></div>`;})()}`;
}

/* ---------- seasonal context ----------
   PriceLabs labels each month Low / Shoulder / High for that specific market and
   reports how far ahead it books. Two properties in different markets can be in
   opposite seasons on the same date, so this is rendered per property. */
function seasonNow(u){
  if(!u.seasons||!u.seasons.length) return null;
  const m=new Date().toLocaleDateString('en-US',{month:'long'});
  return u.seasons.find(x=>x.month===m)||u.seasons[0];
}
function seasonAdvice(u){
  const s=seasonNow(u); if(!s) return null;
  const kind=/high/i.test(s.season)?'high':/shoulder/i.test(s.season)?'shoulder':/low/i.test(s.season)?'low':'';
  const lead=s.bwMax;
  const w=u.wins.filter(x=>!x.na);
  const near=w[0], far=w[w.length-1];
  let line='';
  if(kind==='low'&&lead!=null&&lead<=10)
    line=`Low season here and the market books just ${s.bwMin}–${s.bwMax} days out. Only the near window is actionable — anything beyond it hasn't entered its booking window yet, so a soft-looking gap out there is normal rather than a signal.`;
  else if(kind==='low')
    line=`Low season. Demand is thin, so protect rate rather than chasing occupancy — a discount here buys bookings the market wasn't going to make anyway.`;
  else if(kind==='high')
    line=`High season. This is where the year is made — price to the top of what pace supports, and treat any lag as urgent rather than seasonal.`;
  else if(kind==='shoulder')
    line=`Shoulder season, the hardest to read. Pace swings quickly, so act on the near window and re-check weekly rather than making one big move.`;
  if(near&&far&&kind==='low'&&lead!=null&&lead<=10&&far.gap<-cfgFor(u).gapHold)
    line+=` The ${far.label} gap looks alarming but is mostly an artefact of the short booking window.`;
  return {...s,kind,line};
}
function seasonStrip(u){
  if(!u.seasons||!u.seasons.length){
    const st=u.enrich&&u.enrich.health;
    if(st==='pending'||!st) return '<div class="note">Loading seasonal context from PriceLabs…</div>';
    if(st==='ok') return '<div class="note">PriceLabs returned no month-by-month seasonal data for this listing — usually too little synced history.</div>';
    return `<div class="note"><strong>Seasonal context unavailable.</strong> PriceLabs\' health endpoint failed: ${esc(String(st))}.
      Booking windows fall back to the fixed ones in Config. <button class="stage" style="margin-left:6px" onclick="retryEnrich('${u.id}')">Retry</button></div>`;
  }
  const now=new Date().toLocaleDateString('en-US',{month:'long'});
  const a=seasonAdvice(u);
  const cls=k=>k==='high'?'s-good':k==='low'?'s-dead':'s-warn';
  return `<div class="season">${u.seasons.map(s=>{
    const k=/high/i.test(s.season)?'high':/low/i.test(s.season)?'low':'shoulder';
    return `<div class="sm ${s.month===now?'now':''} ${cls(k)}">
      <div class="mn">${esc(s.month)}${s.month===now?' · now':''}</div>
      <div class="sv">${esc(s.season||'—')}</div>
      <div class="sd">${s.bwMin!=null?`books ${s.bwMin}–${s.bwMax}d out`:'&nbsp;'}</div>
      <div class="sd">${esc(String(s.detail||'').split('·')[0].trim())}</div>
    </div>`;}).join('')}</div>
    ${a&&a.line?`<div class="note" style="margin-top:-6px"><strong>${esc(a.month)} · ${esc(a.season)}.</strong> ${esc(a.line)}</div>`:''}`;
}

/* ---------- minimum-stay recommendation ----------
   Rules, not judgement: orphan gaps need 1 night, near-term and lagging dates
   want short minimums to catch what's left, strong weekends can carry a longer
   one. Where none of that applies, PriceLabs' own figure stands. */
function recMinStay(u,d,orphanSet){
  const CFG=cfgFor(u);   // shadow global with the property's effective profile
  const pl = d.min_stay!=null ? Number(d.min_stay) : 1;
  if(d.booking_status||d.unbookable) return null;
  const off=(new Date(d.date+'T12:00:00')-Date.now())/864e5;

  if(orphanSet.has(d.date))
    return {n:1,why:'This sits in a 1–2 night gap between bookings. Only a single-night stay can fill it, so any minimum above 1 guarantees it goes empty.'};

  if(off<=CFG.msLastMinuteDays && pl>CFG.msLastMinuteCap)
    return {n:CFG.msLastMinuteCap,why:`Inside ${CFG.msLastMinuteDays} days with a ${pl}-night minimum. Late bookers travel short — this is likely blocking more demand than the price is.`};

  const w=u.wins.find(x=>!x.na && off>x.from && off<=x.to);
  const dow=new Date(d.date+'T12:00:00').getDay();
  const weekend=dow===5||dow===6;

  if(w && w.gap<=-CFG.gapHold && pl>CFG.msLagCap)
    return {n:CFG.msLagCap,why:`Pace is ${Math.abs(w.gap).toFixed(0)} pts behind market in this window and the minimum is ${pl} nights. Shorten it before cutting price — minimums block bookings that discounts can't win back.`};

  if(w && w.gap>=CFG.gapHold && weekend && pl<CFG.msWeekendMin)
    return {n:CFG.msWeekendMin,why:`Strong weekend — you're ${w.gap.toFixed(0)} pts ahead of market here. A 2-night minimum stops a single Saturday booking stranding the Friday next to it.`};

  return {n:pl,why:'Nothing suggests overriding PriceLabs here — their figure already fits the demand and your pace.'};
}

function setCalDays(n){
  const v = n!=null ? n : Number((document.getElementById('caldays')||{}).value||45);
  CAL_DAYS=Math.max(1,Math.min(CAL_HORIZON,Math.round(v)||45));
  localStorage.setItem('rm_caldays',CAL_DAYS);
  document.getElementById('v-cal').innerHTML=calView();
}
function jumpSurge(id){
  const u=byId(id); const now=Date.now();
  const next=Object.keys(u.surge||{}).filter(k=>new Date(k+'T12:00:00')>now).sort()[0];
  if(!next){alert('No surge dates ahead in the loaded range.');return}
  const off=Math.ceil((new Date(next+'T12:00:00')-now)/864e5)+3;
  // A surge night already at its target price would be hidden by the filter,
  // so the jump would scroll to a row that isn't rendered.
  if(ONLY.cal){ ONLY.cal=false; localStorage.setItem('rm_only',JSON.stringify(ONLY));
    toast('Filter switched off so the surge night is visible.','OK',()=>{}); }
  if(off>CAL_DAYS) setCalDays(off); else document.getElementById('v-cal').innerHTML=calView();
  setTimeout(()=>{
    const rows=[...document.querySelectorAll('#v-cal tr.row-surge')];
    if(rows[0]) rows[0].scrollIntoView({behavior:'smooth',block:'center'});
  },80);
}
/* Per-night price recommendation, from the same rules as the window actions:
   pace gap sets the direction, orphans override it, surge dates add a premium. */
function recPrice(u,d,orphanSet){
  const CFG=cfgFor(u);
  if(d.booking_status||d.unbookable) return null;
  const off=(new Date(d.date+'T12:00:00')-Date.now())/864e5;
  const anchor=d.anchor;
  const sg=(u.surge||{})[d.date];
  const w=u.wins.find(x=>!x.na&&off>x.from&&off<=x.to);

  // Target is a position relative to PriceLabs' own number, not a nudge off
  // wherever you happen to be. Pushing the same recommendation twice is a no-op.
  let pct=0, parts=[];
  if(orphanSet.has(d.date)){
    pct=-CFG.orphanDiscount;
    parts.push(`orphan night — ${CFG.orphanDiscount}% below PriceLabs to make a 1-night stay worth taking`);
  } else {
    if(w&&w.d.pct){ pct+=w.d.pct; parts.push(`${w.d.pct>0?'+':''}${w.d.pct}% for ${w.label} pace (${w.gap>=0?'+':''}${w.gap.toFixed(0)} pts vs market)`); }
    if(sg){ pct+=CFG.surgeUpliftPct; parts.push(`+${CFG.surgeUpliftPct}% surge premium — the market lifts here`); }
  }
  const wanted=Math.max(1,Math.round(anchor*(1+pct/100)));
  let p=wanted, clamp=null;
  if(u.min!=null&&p<u.min){ p=Math.round(u.min); clamp='floor'; }
  if(u.max!=null&&p>u.max){ p=Math.round(u.max); clamp='ceiling'; }

  // "Already done" has to mean the price wouldn't move. Comparing target
  // percentages instead misses the case where your floor or ceiling clamps the
  // result back onto the current price — a real no-op that still looked like a change.
  const cur=Math.round(d.eff);
  let already=Math.abs(p-cur)<1;

  // Nights you set by hand inside the cooling period, from before anchors were
  // pinned: we don't know what they were priced from, so leave them alone
  // rather than recommend a fresh cut off a recomputed figure.
  const ov=u.ovr&&u.ovr[d.date];
  const hit=!d.pinned&&!already&&ov&&ov.price_type==='fixed'&&actedOn(`${u.id}:day:${d.date}`);
  if(hit){
    const days=Math.max(0,Math.ceil(((CFG.coolDays||7)*864e5-(Date.now()-hit.ts))/864e5));
    return {p:cur,pct,anchor,already:true,clamp:null,wanted,cooling:true,
      why:`You set this night to ${money(cur)} on ${new Date(hit.ts).toLocaleDateString()}. Holding it for ${days} more day${days===1?'':'s'} so a refresh doesn't stack another change on top.`};
  }

  const clampNote=clamp==='floor'
    ? `The rules want ${money(wanted)}, but your ${money(u.min)} floor holds it there.`
    : clamp==='ceiling'
    ? `The rules want ${money(wanted)}, but your ${money(u.max)} ceiling caps it.`
    : '';
  const basis=parts.length
    ? `Target ${pct>0?'+':''}${pct}% vs PriceLabs' ${money(anchor)} — ${parts.join('; ')}.`
    : `Pace is inside the hold band and nothing marks this date out.`;
  const drift=d.pinned&&Math.abs(d.anchorLive-anchor)>=1
    ? ` PriceLabs has since recomputed its own number to ${money(d.anchorLive)}; this holds the ${money(anchor)} you priced from, so a refresh can't walk your price ${d.anchorLive<anchor?'down':'up'}.`
    : '';
  const pos=`You're currently ${d.vsAnchor>0?'+':''}${d.vsAnchor}% vs PriceLabs' ${money(anchor)}.${drift}`;

  const why=already
    ? (clamp
        ? `Nothing to change — ${clampNote.toLowerCase()} That's where this night already sits.`
        : `Already at ${money(cur)}. ${basis} Pushing would change nothing.`)
    : `${basis} ${clampNote} ${pos}`.replace(/\s+/g,' ').trim();

  return {p,pct,anchor,already,clamp,wanted,why};
}
/* How much is PriceLabs already discounting this night, before you touch it?
   `uncustomized_price` is the pre-adjustment figure, so the gap between that
   and the live price is the discount their engine has already applied. */
/* How far below PriceLabs' base this night already sits. The connector can't
   separate their adjustments from your override, so this is the combined gap —
   the warning wording says so rather than blaming PriceLabs for your own cut. */
function existingDiscount(d){
  const raw=Number(d.uncustomized_price);
  if(!raw||raw<=0||d.eff==null) return 0;
  return Math.max(0,Math.round((raw-d.eff)/raw*100));
}
const discountIsYours=(u,d)=>!!(u.ovr[d.date]&&u.ovr[d.date].price);
function stackCheck(u,nights,pct){
  const C=cfgFor(u);
  if(!(pct<0)) return null;                       // only cuts can stack
  const hits=nights.map(d=>({d,x:existingDiscount(d)})).filter(x=>x.x>=C.stackWarnPct);
  if(!hits.length) return null;
  const worst=hits.reduce((a,b)=>b.x>a.x?b:a);
  const avg=Math.round(hits.reduce((s,h)=>s+h.x,0)/hits.length);
  const mine=hits.filter(h=>discountIsYours(u,h.d)).length;
  const src=mine===hits.length?'your own overrides'
    : mine===0?'PriceLabs\' own adjustments'
    : `PriceLabs' adjustments and your overrides combined (${mine} of ${hits.length} are yours)`;
  return {n:hits.length,avg,worst,
    text:`${hits.length} of these ${nights.length} nights already sit ${avg}% below PriceLabs' base price on average, from ${src} `+
         `(worst: ${fmtD(worst.d.date)} at ${worst.x}% below ${money(Number(worst.d.uncustomized_price))}). `+
         `Cutting a further ${Math.abs(pct)}% compounds that — roughly ${avg+Math.abs(pct)}% below base in total.`};
}

/* ---------- stage button state ----------
   idle: nothing to apply · ready: a change is pending your click · staged: in the tray */
const isStaged=key=>PENDING.some(p=>p.key===key);
function bulkState(u,kind){ return isStaged(`${u.id}:${kind}`)?'staged':''; }

function dayState(u,date){
  if(isStaged(`${u.id}:day:${date}`)) return 'staged';
  const d=u.days.find(x=>x.date===date);
  if(!d||d.booking_status||d.unbookable) return 'idle';
  const gv=id=>{const e=document.getElementById(id);return e&&e.value!==''?Math.round(+e.value):null};
  const np=gv(`dp-${u.id}-${date}`), ns=gv(`ds-${u.id}-${date}`);
  const curMs=(u.ovr[date]&&u.ovr[date].min_stay!=null)?Number(u.ovr[date].min_stay):(d.min_stay??1);
  const changed=(np!==null&&np!==Math.round(d.eff))||(ns!==null&&ns!==curMs);
  return changed?'ready':'idle';
}
function refreshDayBtn(uid,date){
  const b=document.getElementById(`db-${uid}-${date}`); if(!b) return;
  const u=byId(uid); if(!u) return;
  const st=dayState(u,date);
  b.disabled = st==='idle';
  b.className = 'stage day-btn'+(st==='ready'?' ready':st==='staged'?' staged':'');
  b.textContent = st==='staged'?'Staged':'Stage';
  b.title = st==='idle'
    ? 'Enter a new price or minimum stay — or click a recommendation — to enable this.'
    : st==='staged' ? 'Staged. Click again to take it back out of the queue.'
    : 'Add this change to the staging tray.';
  refreshStageAll(uid);        // the row changed, so the Stage-all count changed too
}

/* Stage-all reflects how many rows are currently 'ready'. Kept separate from
   refreshAllDayBtns so a single keystroke can update it without re-walking
   every row's state. */
function refreshStageAll(uid){
  const sa=document.getElementById('stageall-'+uid); if(!sa) return;
  const u=byId(uid); if(!u) return;
  let ready=0;
  document.querySelectorAll('.day-btn').forEach(b=>{
    const m=b.id.match(/^db-(.+)-(\d{4}-\d{2}-\d{2})$/);
    if(m&&m[1]===uid&&dayState(u,m[2])==='ready') ready++;
  });
  sa.disabled = ready===0;
  sa.textContent = ready?`Stage all ${ready} edit${ready>1?'s':''}`:'Stage all';
  sa.className = 'stage'+(ready?' ready':'');
  sa.title = ready?`Stage every night where you've entered a change (${ready})`
    :"Nothing entered yet. Type a price or minimum stay, or click a recommendation.";
}
function refreshAllDayBtns(){
  const seen=new Set();
  document.querySelectorAll('.day-btn').forEach(b=>{
    const m=b.id.match(/^db-(.+)-(\d{4}-\d{2}-\d{2})$/);
    if(!m) return;
    seen.add(m[1]);
    refreshDayBtn(m[1],m[2]);
  });
  seen.forEach(refreshStageAll);
}

/* Clicking a staged row takes it back out of the queue. */
function toggleDay(uid,date){
  const key=`${uid}:day:${date}`;
  const existing=PENDING.find(p=>p.key===key);
  if(existing){ unstage(existing.pid); return; }
  stageDay(byId(uid),date);
}

function stageAllReady(uid){
  const u=byId(uid); if(!u) return;
  const dates=[];
  document.querySelectorAll('.day-btn').forEach(b=>{
    const m=b.id.match(/^db-(.+)-(\d{4}-\d{2}-\d{2})$/);
    if(m&&m[1]===uid&&dayState(u,m[2])==='ready') dates.push(m[2]);
  });
  if(!dates.length){ alert('Nothing entered yet.'); return; }
  dates.forEach(dt=>{ try{ stageDay(u,dt,true) }catch(e){} });
  syncButtons();
}

function applyPrice(uid,date,p){
  const el=document.getElementById(`dp-${uid}-${date}`);
  if(el){ el.value=p; el.focus(); refreshDayBtn(uid,date); }
}
function stageRecPrices(u){
  const orphanSet=new Set(u.orphans.flatMap(o=>o.dates));
  const now=Date.now();
  const rows=u.days.filter(d=>{
    if(d.booking_status||d.unbookable)return false;
    if((new Date(d.date+'T12:00:00')-now)/864e5>CAL_DAYS)return false;
    const r=recPrice(u,d,orphanSet);
    return r&&!r.already;
  });
  if(!rows.length){alert('Every open night in view is already at its target position versus PriceLabs.');return}
  const overrides=rows.map(d=>({date:d.date,price:String(recPrice(u,d,orphanSet).pct),price_type:'percent'}));
  const avgOld=rows.reduce((s,d)=>s+d.eff,0)/rows.length;
  const avgNew=rows.reduce((s,d)=>s+recPrice(u,d,orphanSet).p,0)/rows.length;
  stage({unit:u.name,uid:u.id,key:`${u.id}:recprices`,
    desc:`Apply recommended prices on ${rows.length} night${rows.length>1?'s':''}`,
    change:`avg ${money(avgOld)} → ${money(avgNew)}`,
    pins:rows.map((d,i)=>({date:d.date,anchor:d.anchor,price:Number(overrides[i].price),type:'percent'})),
    run:()=>call('update_listing_date_overrides',{listing_id:u.id,pms:u.pms,overrides})});
}

/* PriceLabs' full factor breakdown (seasonality %, last-minute discount, etc.)
   exists in their Customer API but the MCP connector's get_listing_prices does
   not accept the `reason` flag, so it can't be reached from here. The Live vs
   PL base gap is the closest available signal. */
function reasonText(){ return ''; }

function applyMs(uid,date,n){
  const el=document.getElementById(`ds-${uid}-${date}`);
  if(el){ el.value=n; el.focus(); refreshDayBtn(uid,date); }
}
function stageRecMs(u){
  const CFG=cfgFor(u);
  const orphanSet=new Set(u.orphans.flatMap(o=>o.dates));
  const now=Date.now();
  const changes=u.days.filter(d=>{
    if(d.booking_status||d.unbookable)return false;
    if((new Date(d.date+'T12:00:00')-now)/864e5>CAL_DAYS)return false;
    const r=recMinStay(u,d,orphanSet);
    const cur=(u.ovr[d.date]&&u.ovr[d.date].min_stay!=null)?Number(u.ovr[d.date].min_stay):(d.min_stay??1);
    return r && r.n!==cur;
  });
  if(!changes.length){alert('Every open night in the next 45 days already matches the recommendation.');return}
  const overrides=changes.map(d=>({date:d.date,min_stay:recMinStay(u,d,orphanSet).n}));
  stage({unit:u.name,uid:u.id,key:`${u.id}:recms`,
    desc:`Apply recommended minimum stays on ${changes.length} night${changes.length>1?'s':''}`,
    change:changes.slice(0,6).map(d=>`${fmtD(d.date)}→${recMinStay(u,d,orphanSet).n}`).join(', ')+(changes.length>6?` +${changes.length-6} more`:''),
    run:()=>call('update_listing_date_overrides',{listing_id:u.id,pms:u.pms,overrides})});
}

/* ---------- calendar ---------- */
function calView(){
  const V=vis(); if(!V.length)return emptyState();
  if(!CAL_SEL||!V.find(u=>u.id===CAL_SEL))CAL_SEL=V[0].id;
  const u=V.find(x=>x.id===CAL_SEL);
  const sel=`<select onchange="CAL_SEL=this.value;document.getElementById('v-cal').innerHTML=calView()">
    ${V.map(x=>`<option value="${x.id}"${x.id===CAL_SEL?' selected':''}>${esc(x.name)}</option>`).join('')}</select>`;

  const now=Date.now();
  const soon=u.days.filter(d=>(new Date(d.date+'T12:00:00')-now)/864e5<=CAL_DAYS);
  const stale=u.refreshed?Math.round((Date.now()-new Date(u.refreshed))/36e5):null;
  const orphanSet=new Set(u.orphans.flatMap(o=>o.dates));
  const surgeN=soon.filter(d=>(u.surge||{})[d.date]).length;
  const recPriceDiff=soon.filter(d=>{
    if(d.booking_status||d.unbookable)return false;
    const r=recPrice(u,d,orphanSet); return r&&!r.already;
  }).length;
  const recDiff=soon.filter(d=>{
    if(d.booking_status||d.unbookable)return false;
    const r=recMinStay(u,d,orphanSet);
    const c=(u.ovr[d.date]&&u.ovr[d.date].min_stay!=null)?Number(u.ovr[d.date].min_stay):(d.min_stay??1);
    return r&&r.n!==c;
  }).length;

  const shownNights=ONLY.cal?soon.filter(d=>nightActionable(u,d,orphanSet)):soon;
  const rows=shownNights.map(d=>{
    const bk=!!d.booking_status||!!d.unbookable;
    const o=u.ovr[d.date];
    const pinned=u.min!=null&&d.price<=u.min+0.5;
    const dow=new Date(d.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    const oms=o&&o.min_stay!=null?Number(o.min_stay):null;
    const longMs=oms!=null&&d.min_stay!=null&&oms>d.min_stay;
    // One column for min stay: your override when set, PriceLabs' figure otherwise.
    const msCell = oms!=null
      ? `<span class="ovr" style="${longMs?'background:#fef3c7;color:#a16207':''}">${oms}</span>`
        + (d.min_stay!=null?` <span class="muted tiny">/ ${d.min_stay}</span>`:'')
      : `<span class="muted">${d.min_stay??'—'}</span>`;
    const rsn = reasonText(u,d);
    const exd = existingDiscount(d);
    const rp = bk?null:recPrice(u,d,orphanSet);
    const rpDelta = rp&&d.eff>0 ? Math.round((rp.p-d.eff)/d.eff*100) : 0;
    const rpCell = !rp ? '<span class="muted">—</span>'
      : rp.already ? `<span class="muted" title="${esc(rp.why)}">${money(rp.p)}${rp.clamp?` <span class="pill mini p-hold">${rp.clamp==='floor'?'FLR':'CAP'}</span>`:''}</span>`
      : `<button class="stage rec ${rp.p<d.eff?'rec-cut':'rec-raise'}" title="${esc(rp.why)} — click to fill the input"
           onclick="applyPrice('${u.id}','${d.date}',${rp.p})">${money(rp.p)} ${rp.p<d.eff?'↓':'↑'}${Math.abs(rpDelta)}%</button>`;
    const cur = oms!=null?oms:(d.min_stay??1);
    const rec = recMinStay(u,d,orphanSet);
    const recCell = !rec ? '<span class="muted">—</span>'
      : rec.n===cur ? `<span class="muted" title="Nothing to change — this night is already at ${rec.n} night${rec.n===1?'':'s'}. ${esc(rec.why)}">${rec.n}</span>`
      : `<button class="stage rec ${rec.n<cur?'rec-cut':'rec-raise'}" title="${esc(rec.why)} — click to fill the input"
           onclick="applyMs('${u.id}','${d.date}',${rec.n})">${rec.n} ${rec.n<cur?'↓':'↑'}</button>`;
    const sg=(u.surge||{})[d.date];
    const hiDemand=/high demand/i.test(d.demand_desc||'');
    const goodDemand=/good demand/i.test(d.demand_desc||'');
    let tags='';
    if(sg) tags+=`<span class="pill mini p-surge" title="${sg.type==='price'?'Surge — market prices spike here versus surrounding dates':sg.type==='demand'?'Surge — market occupancy spikes here versus surrounding dates':sg.type==='both'?'Surge — both market price and occupancy spike here':'Surge — inside a market surge window PriceLabs flagged'}">S</span>`;
    if(hiDemand) tags+=`<span class="pill mini p-cut" title="High demand — PriceLabs rates demand as High for this night">H</span>`;
    else if(goodDemand&&!sg) tags+=`<span class="pill mini p-watch" title="Good demand — PriceLabs rates demand as Good for this night">G</span>`;
    if(orphanSet.has(d.date)) tags+=`<span class="pill mini p-hold" title="Orphan — a 1–2 night gap between bookings. Price it to move.">O</span>`;
    return `<tr class="${bk?'booked':''} ${sg?'row-surge':''}">
      <td>${fmtD(d.date)} <span class="muted tiny">${dow}</span>${tags}</td>
      <td data-l="PriceLabs" class="r bignum"${rsn?` title="${esc(rsn)}" style="cursor:help;border-bottom:1px dotted #a1a1aa"`:''}>${money(d.price)}${pinned&&!bk?' <span class="pill mini p-watch">FLR</span>':''}</td>
      <td data-l="Pre-adj." class="r bignum ${exd>=cfgFor(u).stackWarnPct?'s-warn':'muted'}"${exd?` title="PriceLabs is already ${exd}% below this pre-adjustment rate on this night"`:''}>${d.uncustomized_price>0?money(d.uncustomized_price):'—'}${exd>=cfgFor(u).stackWarnPct?` <span class="pill mini p-watch">-${exd}%</span>`:''}</td>
      <td data-l="On channel" class="r bignum muted"${d.user_price>0&&Math.abs(d.user_price-d.price)>1?` title="What's currently live on the channel. It differs from the Live price above, which means PriceLabs hasn't pushed the change yet."`:''}>${d.user_price>0?money(d.user_price)+(Math.abs(d.user_price-d.price)>1?' <span class="pill mini p-watch">lag</span>':''):'—'}</td>
      <td data-l="Your override" class="r">${o&&o.price?`<span class="ovr">${o.price_type==='fixed'?money(Number(o.price)):(Number(o.price)>0?'+':'')+o.price+'%'}</span>`:'<span class="muted">—</span>'}${!bk&&d.vsAnchor?`<div class="tiny ${Math.abs(d.vsAnchor)>=10?(d.vsAnchor>0?'up':'down'):'muted'}" title="Your effective price versus PriceLabs' own number for this night">${d.vsAnchor>0?'+':''}${d.vsAnchor}% vs PL</div>`:''}</td>
      <td data-l="Recommended" class="r">${rpCell}</td>
      <td data-l="Min stay" class="r">${msCell}</td>
      <td data-l="Rec. stay" class="r">${bk?'<span class="muted">—</span>':recCell}</td>
      <td data-l="New price">${bk?`<span class="tiny">${esc(d.booking_status||'blocked')}</span>`
        :`<input type="number" id="dp-${u.id}-${d.date}" placeholder="${Math.round(d.eff)}" style="width:70px" oninput="refreshDayBtn('${u.id}','${d.date}')">`}</td>
      <td data-l="New stay">${bk?'':`<input type="number" id="ds-${u.id}-${d.date}" placeholder="${d.min_stay??1}" style="width:48px" oninput="refreshDayBtn('${u.id}','${d.date}')">`}</td>
      <td data-l="">${bk?'':`<button class="stage day-btn" id="db-${u.id}-${d.date}" onclick="toggleDay('${u.id}','${d.date}')" disabled>Stage</button>`}</td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <div class="chead"><div><h2>${esc(u.name)}</h2>
      <div class="tiny muted">${shownNights.length} night${shownNights.length===1?'':'s'} shown${ONLY.cal&&soon.length!==shownNights.length?` of ${soon.length}`:''} · booked rows are locked · ${u.ovrN} override${u.ovrN===1?'':'s'} committed${surgeN?` · <strong style="color:#a16207">${surgeN} surge night${surgeN===1?'':'s'}</strong>`:''}</div></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${onlyToggle('cal',shownNights.length,soon.length,'nights')}
        <button class="stage bulk-btn ${bulkState(u,'recprices')}" data-key="${u.id}:recprices" data-done="Prices staged" onclick="stageRecPrices(byId('${u.id}'))" ${recPriceDiff?'':'disabled'}
          title="${recPriceDiff?`Stage the recommended price on ${recPriceDiff} night${recPriceDiff>1?'s':''}`:'Every open night in view is already at its target position versus PriceLabs'}">
          ${bulkState(u,'recprices')==='staged'?'Prices staged':recPriceDiff?`Apply ${recPriceDiff} price rec${recPriceDiff>1?'s':''}`:'Prices on target'}</button>
        <button class="stage bulk-btn ${bulkState(u,'recms')}" data-key="${u.id}:recms" data-done="Min stays staged" onclick="stageRecMs(byId('${u.id}'))" ${recDiff?'':'disabled'}
          title="${recDiff?`Stage the recommended minimum stay on ${recDiff} night${recDiff>1?'s':''}`:'Every open night in view already matches the recommended minimum stay'}">
          ${bulkState(u,'recms')==='staged'?'Min stays staged':recDiff?`Apply ${recDiff} min-stay rec${recDiff>1?'s':''}`:'Min stays on target'}</button>
        ${sel}</div></div>
    ${seasonStrip(u)}
    <div class="ctl" style="margin-bottom:12px">
      <label class="f">Show next
        <span style="display:flex;gap:5px;align-items:center">
          <input type="number" id="caldays" value="${CAL_DAYS}" min="1" max="${CAL_HORIZON}" style="width:76px">
          <span class="tiny muted" style="text-transform:none;font-weight:400">nights</span>
        </span></label>
      <button onclick="setCalDays()">Apply</button>
      <span style="display:flex;gap:5px;flex-wrap:wrap">
        ${[30,45,90,180,365].map(n=>`<button class="stage${CAL_DAYS===n?' on':''}" onclick="setCalDays(${n})">${n}</button>`).join('')}
      </span>
      ${surgeN?`<button class="stage" onclick="jumpSurge('${u.id}')">Jump to next surge</button>`:''}

      <span class="tiny muted">Data loaded ${CAL_HORIZON} days out</span>
    </div>
    ${stale!=null&&stale>18?`<div class="warnbox"><strong>PriceLabs last recomputed this calendar ${stale>48?Math.round(stale/24)+' days':stale+' hours'} ago.</strong>
      The <em>PriceLabs price</em> column reflects that snapshot, so a change you pushed since then won't show there yet — check the <em>Your override</em> column instead, which reads live.
      <button class="stage" style="margin-left:6px" onclick="stageRefresh(byId('${u.id}'))">Stage a recompute</button></div>`:''}
    <div class="scroll cal tall"><table><thead><tr>
      <th>${tip('pills','Date')}</th>
      <th class="r">${tip('plprice','Live')}</th>
      <th class="r">${tip('raw','PL base')}</th>
      <th class="r">${tip('channel','On channel')}</th>
      <th class="r">${tip('ovr','Your override')}</th>
      <th class="r">${tip('priceRec','Rec. price')}</th>
      <th class="r">${tip('ovrMs','Min stay')}</th>
      <th class="r">${tip('msRec','Rec.')}</th>
      <th colspan="2" style="text-align:center;border-left:1px solid #e4e4e7">Set new</th>
      <th style="text-align:right"><button class="stage" id="stageall-${u.id}" onclick="stageAllReady('${u.id}')" disabled
        title="Stage every night where you've entered a change">Stage all</button></th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    ${shownNights.length?'':`<div class="note" style="text-align:center">
      <strong>Every night in view is already where it should be.</strong>
      No price or minimum-stay change is recommended across these ${soon.length} nights.
      Switch the filter off to see them anyway.</div>`}
    <div class="note"><strong>Reading this table.</strong> <em>Live</em> is the final rate after everything, including your own overrides — once you override a night this shows your number, not PriceLabs'.
      <em>PL base</em> is PriceLabs' figure before their adjustments and before yours; your changes never move it, which is why recommendations are measured against it.
      <em>On channel</em> is what PriceLabs last saw on Airbnb or Vrbo — a persistent gap means the change hasn't synced.
      The difference between Live and PL base is PriceLabs' own adjustments plus your override combined; the connector doesn't expose them separately.
      <em>Your override</em> is what you've committed — anything there is live in PriceLabs.
      <em>Min stay</em> shows PriceLabs' figure in grey; once you set an override it shows yours in blue with theirs after the slash.</div>
  </div>`;
}

async function runDiagnose(id){
  const u=byId(id),box=document.getElementById('diag-'+id);
  box.innerHTML='<div class="note">Running deep diagnosis…</div>';
  try{
    const r=await call('diagnose_no_bookings',{listing_id:u.id,pms_name:u.pms,
      question:"Why isn't this listing getting bookings?"});
    const d=r.data?.data||{};
    // d.result is the written answer, d.reccomendations a newline list, d.actions a
    // status map. d.context_string is PriceLabs' internal prompt — never render it.
    const md=t=>esc(String(t||''))
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .split(/\n\s*\n/).map(p=>`<p style="margin:0 0 10px">${p.replace(/\n/g,'<br>')}</p>`).join('');
    const recs=String(d.reccomendations||'').split('\n').map(x=>x.replace(/^\d+\.\s*/,'').trim()).filter(Boolean);

    // Flatten the actions map into flagged / clear
    const flat=[];
    const walk=(o,prefix='')=>Object.entries(o||{}).forEach(([k,v])=>{
      if(v&&typeof v==='object'&&'status' in v) flat.push({k:prefix+k,status:v.status,value:v.value});
      else if(v&&typeof v==='object') walk(v,'');
    });
    walk(d.actions);
    const flagged=flat.filter(x=>x.status==='Y');
    const label=k=>k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

    box.innerHTML=`<div class="card" style="margin-top:12px">
      <div class="chead"><div><h2>Why isn't this booking?</h2>
        <div class="tiny muted">PriceLabs diagnostic${d.confidence!=null?` · confidence ${d.confidence}`:''}</div></div></div>
      ${d.result?`<div style="font-size:13.5px">${md(d.result)}</div>`:''}
      ${recs.length?`<h3>What PriceLabs suggests</h3>${recs.map(x=>
        `<div class="act md"><div class="w">${esc(x)}</div></div>`).join('')}`:''}
      ${flagged.length?`<h3>Settings it flagged</h3>
        <div class="scroll"><table><tbody>${flagged.map(x=>
          `<tr><td>${esc(label(x.k))}</td><td class="r"><span class="pill p-watch">flagged</span></td></tr>`).join('')}
        </tbody></table></div>
        <div class="note">Flagged means this setting is customised away from PriceLabs' default and may be affecting your prices. Not necessarily wrong — just worth a look.</div>`
        :'<div class="note">No pricing settings flagged as non-default.</div>'}
      <div class="note"><strong>Note on the date range.</strong> This tool picks its own period of interest from your question and often reads a bare month name as <em>next</em> year. If the analysis references a period you didn't mean, re-run it with an explicit range.</div>
    </div>`;
  }catch(e){
    box.innerHTML=`<div class="err">PriceLabs couldn't diagnose this listing: ${esc(e.message)}
      <br><span class="tiny">This tool needs recent synced pricing data. If sync is off or was just enabled, turn it on and retry in a day or two.</span></div>`;
  }
}

/* ---------- stage builders ---------- */
function stagePrices(u){
  const g=k=>{const e=document.getElementById(k+'-'+u.id);return e&&e.value!==''?Math.round(+e.value):null};
  const nb=g('base'),nm=g('min'),nx=g('max');
  const body={id:u.id,pms:u.pms},bits=[];
  if(nb!==null&&nb!==u.base){body.base=nb;bits.push(`base ${u.base!=null?money(u.base):'—'} → ${money(nb)}`)}
  if(nm!==null&&nm!==u.min){body.min=nm;bits.push(`min ${u.min!=null?money(u.min):'none'} → ${money(nm)}`)}
  if(nx!==null&&nx!==u.max){body.max=nx;bits.push(`max ${u.max!=null?money(u.max):'none'} → ${money(nx)}`)}
  if(!bits.length){alert('Nothing changed.');return}
  stage({unit:u.name,uid:u.id,key:`${u.id}:prices`,desc:'Update listing price settings',change:bits.join(' · '),
    run:()=>call('update_listing_data',{listings:[body]})});
}
function quickMin(id,mult){const u=byId(id);
  stage({unit:u.name,uid:u.id,key:`${u.id}:floor`,desc:'Raise price floor',change:`min ${money(u.min)} → ${money(u.min*mult)}`,
    run:()=>call('update_listing_data',{listings:[{id:u.id,pms:u.pms,min:Math.round(u.min*mult)}]})})}
function quickBase(id){const u=byId(id);
  stage({unit:u.name,uid:u.id,key:`${u.id}:base`,desc:"Match PriceLabs' recommended base",change:`base ${money(u.base)} → ${money(u.recBase)}`,
    run:()=>call('update_listing_data',{listings:[{id:u.id,pms:u.pms,base:Math.round(u.recBase)}]})})}
function stageWindow(u,w){
  const el=document.getElementById(`pct-${u.id}-${w.key}`);
  const pct=el?+el.value:w.d.pct;
  if(!pct){alert('Enter a percentage.');return}
  const nights=openIn(u,w.from,w.to);
  if(!nights.length){alert('No unbooked nights in that window.');return}
  // Percent overrides ride on top of PriceLabs' own number rather than replacing
  // it, so re-pushing the same move is a no-op instead of compounding.
  const overrides=nights.map(d=>({date:d.date,price:String(pct),price_type:'percent'}));
  const avg=nights.reduce((s,d)=>s+d.anchor,0)/nights.length;
  const stk=stackCheck(u,nights,pct);
  if(stk && !confirm('Heads up before staging this cut.\n\n'+stk.text+'\n\nStage it anyway?')) return;
  stage({unit:u.name,uid:u.id,key:`${u.id}:win:${w.key}`,warn:stk?stk.text:null,
    desc:`${pct>0?'Raise':'Cut'} ${Math.abs(pct)}% on ${nights.length} unbooked night${nights.length>1?'s':''}, ${w.label}`,
    change:`${pct>0?'+':''}${pct}% vs PriceLabs · avg ${money(avg)} → ${money(avg*(1+pct/100))}`,
    run:()=>call('update_listing_date_overrides',{listing_id:u.id,pms:u.pms,overrides})});
}
function stageOrphans(u){
  const CFG=cfgFor(u);
  const byDate=Object.fromEntries(u.days.map(d=>[d.date,d]));
  const dates=u.orphans.flatMap(o=>o.dates);
  const overrides=dates.map(dt=>({date:dt,price:String(-CFG.orphanDiscount),price_type:'percent',min_stay:CFG.orphanMinStay}));
  stage({unit:u.name,uid:u.id,key:`${u.id}:orphans`,desc:`Clear ${dates.length} orphan night${dates.length>1?'s':''} — 25% off, 1-night minimum`,
    change:dates.map(fmtD).join(', '),
    run:()=>call('update_listing_date_overrides',{listing_id:u.id,pms:u.pms,overrides})});
}
function stageDay(u,date,quiet){
  const d=u.days.find(x=>x.date===date);
  const p=document.getElementById(`dp-${u.id}-${date}`),s=document.getElementById(`ds-${u.id}-${date}`);
  const np=p.value!==''?Math.round(+p.value):null,ns=s.value!==''?Math.round(+s.value):null;
  const o={date},bits=[];
  if(np!==null&&np!==Math.round(d.eff)){o.price=String(np);o.price_type='fixed';o.currency=u.cur;bits.push(`${money(d.eff)} → ${money(np)}`)}
  if(ns!==null&&ns!==d.min_stay){o.min_stay=ns;bits.push(`min-stay ${d.min_stay??'—'} → ${ns}`)}
  if(!bits.length){ if(!quiet) alert('Nothing changed for '+fmtD(date)); return }
  stage({unit:u.name,uid:u.id,key:`${u.id}:day:${date}`,desc:`Override ${fmtD(date)}`,change:bits.join(' · '),
    pins:o.price?[{date,anchor:d.anchor,price:Number(o.price),type:'fixed'}]:null,
    run:()=>call('update_listing_date_overrides',{listing_id:u.id,pms:u.pms,overrides:[o]})});
}
function stageClear(u){
  const days=Number(document.getElementById('clr-'+u.id).value||30);
  const nights=openIn(u,0,days);
  if(!nights.length){alert('No unbooked nights in that range.');return}
  stage({unit:u.name,uid:u.id,key:`${u.id}:clear`,desc:`Remove overrides on ${nights.length} night${nights.length>1?'s':''}, next ${days} days`,
    change:'revert to standard PriceLabs pricing',
    run:()=>call('delete_listing_date_overrides',{listing_id:u.id,pms:u.pms,overrides:nights.map(d=>({date:d.date}))})});
}
function stageRefresh(u){
  stage({unit:u.name,uid:u.id,key:`${u.id}:refresh`,desc:'Recompute pricing calendar',change:'full refresh',
    run:()=>call('refresh_listing_pricing',{listing_id:u.id,pms:u.pms,exclude_reasons_json:true})});
}
function stageNudge(nid,lid,pms,name,label){
  stage({unit:name||lid,uid:lid,key:`${lid}:nudge`,desc:'Accept PriceLabs nudge',change:label,
    run:()=>call('accept_nudge',{nudge_id:nid,listing_id:lid,pms:pms,question:'Accept this price nudge'})});
}

          <input type="text" id="cfg-connector" value="${esc(PL)}" style="flex:1 1 auto;font-family:ui-monospace,monospace;font-size:12px">
          <button onclick="setConnector(document.getElementById('cfg-connector').value)">Apply &amp; reload</button>
        </span>
        <span class="tiny muted" style="text-transform:none;font-weight:400">Unique to your PriceLabs connection. If you received this dashboard from someone else, replace it with yours &mdash; ask Claude &ldquo;what is my PriceLabs MCP tool prefix?&rdquo;</span>
      </label>
    </div>
    <div class="ctl">
      <label class="f" style="flex:1 1 260px">Profile name
        <input type="text" id="cfg-profileName" value="${esc(CFG.profileName)}" style="width:100%"></label>
      <label class="f" style="flex:2 1 380px">Market notes
        <input type="text" id="cfg-marketNotes" value="${esc(CFG.marketNotes)}" style="width:100%"></label>
    </div>
    <div class="note"><strong>Sharing this with another operator?</strong> Have them connect their own PriceLabs account, then hit
      <em>Export</em> here and send them the JSON — they import it and inherit your thresholds without touching any of your data.
      Remind them to review <em>Market notes</em> and the seasonal assumptions: thresholds travel between markets, seasonality does not.
      A desert market's April cliff is wrong for a coastal one.</div>
  </div>

  <div class="card"><h2>Booking windows</h2>
    <div class="tiny muted" style="margin-bottom:10px">Forward windows compared against market, in days from today. Add or remove rows to match how your market actually books.</div>
    <div class="scroll"><table><thead><tr><th>Label</th><th>From</th><th>To</th><th>Mode</th><th>Guidance shown</th><th></th></tr></thead>
    <tbody>${winRows}</tbody></table></div>
    <div style="margin-top:10px"><button onclick="addWindow()">Add window</button></div>
  </div>

  <h3 style="margin-left:2px">Market profiles</h3>
  <div class="note" style="margin:0 0 12px">Profiles let one dashboard serve several markets. A property is claimed by the last profile whose city or state matches it, otherwise it falls back to Default. Only the values you fill in override the base config below.</div>
  ${profileCards}
  <div class="card"><button onclick="addProfile()">Add a market profile</button></div>

  ${seasonCards?`<h3 style="margin-left:2px">Seasonal booking windows</h3>
  <div class="note" style="margin:0 0 12px">PriceLabs measures how far ahead each market books, month by month. With seasonal windows on, the boundaries resize themselves as the season turns — a market booking 1–5 days out in August shouldn't be judged on the same window as one booking 4–25 days out in October.</div>
  <div class="ctl" style="margin-bottom:12px">
    <label class="f">Seasonal windows
      <select id="cfg-seasonalWindows-sel">
        <option value="1"${CFG.seasonalWindows?' selected':''}>Derive from PriceLabs</option>
        <option value="0"${!CFG.seasonalWindows?' selected':''}>Use fixed windows from config</option>
      </select></label>
  </div>${seasonCards}`:''}

  ${groups}

  <div class="card">
    <button class="go" onclick="applyCfg()">Save and recalculate</button>
    <span class="tiny muted" style="margin-left:10px">Recommendations refresh immediately. No PriceLabs data is refetched unless the horizon changed.</span>
  </div>`;
}
function addProfile(){
  CFG.profiles.push({id:'p'+Date.now().toString(36),name:'New market',
    match:{cities:[],states:[]},notes:'',overrides:{}});
  saveCfg(); renderAll();
}
function delProfile(i){
  if(CFG.profiles[i].id==='default')return;
  if(!confirm(`Delete the "${CFG.profiles[i].name}" profile? Properties it claimed fall back to Default.`))return;
  CFG.profiles.splice(i,1); saveCfg(); recalc();
}
function saveWinOverride(uid,n){
  const w=[];
  for(let j=0;j<n;j++){
    const g=id=>(document.getElementById(id)||{}).value;
    w.push({key:'w'+j,label:g(`uw-${uid}-label-${j}`),from:Number(g(`uw-${uid}-from-${j}`)),
      to:Number(g(`uw-${uid}-to-${j}`)),mode:g(`uw-${uid}-mode-${j}`),speed:''});
  }
  w.sort((a,b)=>a.from-b.from);
  const u=byId(uid); if(!u)return;
  u.winOverride=w; localStorage.setItem('rm_win_'+uid,JSON.stringify(w));
  recalc(); toast('Windows saved for '+u.name,'Done',()=>{});
}
function clearWinOverride(uid){
  const u=byId(uid); if(!u)return;
  u.winOverride=null; localStorage.removeItem('rm_win_'+uid);
  recalc(); toast('Reverted to derived windows.','Done',()=>{});
}
function addWindow(){
  const last=CFG.windows[CFG.windows.length-1];
  const from=last?last.to:0;
  CFG.windows.push({key:'w'+(Date.now()%100000),label:`${from}–${from+30} days`,from,to:from+30,speed:'',mode:'act'});
  saveCfg(); renderAll();
}
function delWindow(i){ CFG.windows.splice(i,1); saveCfg(); recalc(); }
function applyCfg(){
  const prevHorizon=CFG.calHorizon;
  CFG_FIELDS.forEach(([,fields])=>fields.forEach(([k])=>{
    const el=document.getElementById('cfg-'+k);
    if(el&&el.value!=='') CFG[k]=Number(el.value);
  }));
  ['profileName','marketNotes'].forEach(k=>{
    const el=document.getElementById('cfg-'+k); if(el) CFG[k]=el.value;
  });
  const sw=document.getElementById('cfg-seasonalWindows-sel');
  if(sw) CFG.seasonalWindows = sw.value==='1';
  CFG.profiles=CFG.profiles.map((p,i)=>{
    const g=id=>(document.getElementById(id)||{}).value;
    const list=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
    const ov={};
    CFG_FIELDS.flatMap(([,f])=>f).forEach(([k])=>{
      const el=document.getElementById(`pf-${i}-${k}`);
      if(el&&el.value!=='') ov[k]=Number(el.value);
    });
    return {...p, name:g(`pf-name-${i}`)||p.name, notes:g(`pf-notes-${i}`)??p.notes,
      match:p.id==='default'?{cities:[],states:[]}
        :{cities:list(g(`pf-cities-${i}`)),states:list(g(`pf-states-${i}`))},
      overrides:ov};
  });
  CFG.windows=CFG.windows.map((w,i)=>({
    key:w.key,
    label:(document.getElementById('cfgw-label-'+i)||{}).value||w.label,
    from:Number((document.getElementById('cfgw-from-'+i)||{}).value??w.from),
    to:Number((document.getElementById('cfgw-to-'+i)||{}).value??w.to),
    mode:(document.getElementById('cfgw-mode-'+i)||{}).value||w.mode,
    speed:(document.getElementById('cfgw-speed-'+i)||{}).value||''
  })).sort((a,b)=>a.from-b.from);
  saveCfg();
  CAL_DAYS=CFG.calDays;
  if(CFG.calHorizon!==prevHorizon){ CAL_HORIZON=CFG.calHorizon; toast('Horizon changed — reloading data.','OK',()=>{}); main(); return; }
  recalc();
  toast('Configuration saved.','Done',()=>{});
}
function recalc(){
  // Re-derive everything that depends on thresholds, without refetching.
  UNITS.forEach(u=>{
    u._acts=null; u._open={};
    u.profile=profileFor({city_name:(u.city||'').split(',')[0],state:(u.city||'').split(',')[1]});
    const C=cfgFor(u);
    u.wins=WINDOWS(u).map(w=>{
      const disc=(o,a,b)=>(o[a]==null||o[b]==null)?null:(o[b]*b-o[a]*a)/(b-a);
      const mine=w.from===0?u.cum[snapDFD(w.to)]:disc(u.cum,w.from,w.to);
      const mk=w.from===0?u.mkt[snapDFD(w.to)]:disc(u.mkt,w.from,w.to);
      if(mine==null||mk==null)return{...w,na:true};
      return{...w,mine,mk,gap:mine-mk,d:decide(w.key,mine-mk,C,WINDOWS(u),mk,revPicture(u,w))};
    });
    u.orphans=findOrphans(u.days.filter(d=>new Date(d.date+'T12:00:00')<=Date.now()+90*864e5),cfgFor(u));
    u.worst=u.wins.filter(w=>!w.na).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap))[0]||null;
  });
  renderAll();
}
function exportCfg(){
  const blob=new Blob([JSON.stringify(CFG,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(CFG.profileName||'revenue-config').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importCfg(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||typeof o!=='object') throw new Error('not an object');
      CFG={...CFG_DEFAULTS,...o};
      if(!Array.isArray(CFG.windows)||!CFG.windows.length) CFG.windows=structuredClone(CFG_DEFAULTS.windows);
      saveCfg(); CAL_DAYS=CFG.calDays; CAL_HORIZON=CFG.calHorizon;
      recalc(); toast('Configuration imported.','OK',()=>{});
    }catch(e){ alert('That file is not a valid configuration export: '+e.message); }
    input.value='';
  };
  r.readAsText(f);
}
function resetCfg(){
  if(!confirm('Reset every setting to the defaults?')) return;
  CFG=structuredClone(CFG_DEFAULTS); saveCfg();
  CAL_DAYS=CFG.calDays; CAL_HORIZON=CFG.calHorizon; recalc();
}

/* ---------- log & hidden ---------- */
function renderLog(){
  const el=document.getElementById('v-log');
  if(!LOG.length){el.innerHTML='<div class="card"><h2>No changes pushed yet</h2><p class="muted" style="margin-bottom:0">Everything you send to PriceLabs from here gets recorded, so next week you can tell which move caused which change in pace.</p></div>';return}
  el.innerHTML=`<div class="card">
    <div class="chead"><div><h2>Change log</h2><div class="tiny muted">${LOG.length} pushed change${LOG.length>1?'s':''}</div></div>
    <div style="display:flex;gap:8px"><button onclick="copyLog()">Copy as markdown</button>
    <button class="warn" onclick="if(confirm('Clear the log?')){LOG=[];saveL();renderLog()}">Clear</button></div></div>
    <div class="scroll"><table><thead><tr><th>When</th><th>Unit</th><th>Change</th></tr></thead><tbody>
    ${LOG.map(e=>`<tr><td class="tiny">${dayName(e.ts)}</td><td>${esc(e.unit)}</td>
      <td>${e.desc}<div class="tiny muted">${e.change}</div></td></tr>`).join('')}
    </tbody></table></div>
    <div class="note">This log lives in the dashboard, not your files. Hit <strong>Copy as markdown</strong> and ask me to append it to <em>revenue-rules.md</em> to make it permanent.</div></div>`;
}
function copyLog(){
  const md='| Date | Unit | Change | Result |\n| :-- | :-- | :-- | :-- |\n'+
    LOG.map(e=>`| ${new Date(e.ts).toLocaleDateString('en-US')} | ${e.unit} | ${e.desc} — ${String(e.change).replace(/<[^>]*>/g,'')} | |`).join('\n');
  navigator.clipboard.writeText(md).then(()=>alert('Copied. Ask me to append it to revenue-rules.md.'),()=>alert(md));
}
function hideUnit(id){
  const u=byId(id);
  if(!HIDDEN.includes(id))HIDDEN.push(id);
  saveH(); renderAll();
  toast(`Hid ${u?u.name:'property'}.`,'Undo',()=>unhideUnit(id));
}
function unhideUnit(id){HIDDEN=HIDDEN.filter(x=>x!==id);saveH();renderAll()}
function unhideAll(){HIDDEN=[];saveH();renderAll()}

function toast(msg,label,fn){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.innerHTML=`<span>${esc(msg)}</span>`;
  const b=document.createElement('button');
  b.className='stage'; b.textContent=label;
  b.onclick=()=>{fn();t.classList.remove('on')};
  t.appendChild(b);
  t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),8000);
}

function hiddenBar(){
  if(!HIDDEN.length)return '';
  return `<div class="note"><strong>${HIDDEN.length} propert${HIDDEN.length>1?'ies':'y'} hidden from this dashboard.</strong>
    They're untouched in PriceLabs — hiding only changes what you see here.
    <div style="margin-top:8px">${
    HIDDEN.map(id=>{const u=UNITS.find(x=>x.id===id);
      return `<span style="display:inline-flex;align-items:center;gap:6px;margin:0 10px 6px 0"><span class="tiny">${esc(u?u.name:id)}</span>
      <button class="stage" onclick="unhideUnit('${id}')">Unhide</button></span>`}).join('')}
      <button class="stage" onclick="unhideAll()">Show all</button></div></div>`;
}

/* ---------- boot ---------- */
const byId=id=>UNITS.find(u=>u.id===id);
const win=(id,k)=>byId(id).wins.find(w=>w.key===k);

/* Render only the tab in view. Rebuilding every tab on every state change is
   fine at two properties and wasteful at twenty. */
let CUR='portfolio';
function killCharts(){ Object.keys(CHARTS).forEach(k=>{try{CHARTS[k].destroy()}catch(e){} delete CHARTS[k]}); }

function renderAll(){
  const V=vis();
  const st=document.getElementById('stamp');
  if(st) st.innerHTML = STALE
    ? `<span class="down">Cached — ${new Date(STALE).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>`
    : (LOADED_AT?'Refreshed '+new Date(LOADED_AT).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'');
  const c=document.getElementById('vcount');
  if(c)c.innerHTML=HIDDEN.length
    ? `Showing ${V.length} of ${UNITS.length} <button class="stage" style="margin-left:4px" onclick="unhideAll()">Show all</button>`
    : '';

  if(CUR==='portfolio'){
    document.getElementById('v-portfolio').innerHTML=portfolioView();
  } else if(CUR==='actions'){
    document.getElementById('v-actions').innerHTML=(NUDGE_HTML?`<div class="card">${NUDGE_HTML}</div>`:'')+buildActions(V)+
      `<div class="note"><strong>How these are decided.</strong> Occupancy per forward window is compared against your PriceLabs comp set.
       Inside &plusmn;8 pts is hold; behind by 8&ndash;15 is a modest cut, 15+ a deep one; ahead by 8+ means raise.
       61&ndash;90 days is watch-only unless you're 20+ pts behind. Every Stage button skips booked nights.
       Thresholds live in <em>Revenue Management/revenue-rules.md</em>.</div>`;
  } else if(CUR==='units'){
    killCharts();
    const shownU=ONLY.units?V.filter(u=>liveCount(u)>0):V;
    const openN=shownU.filter(u=>isOpen(u.id)).length;
    document.getElementById('v-units').innerHTML=
      (V.length?`<div class="bar" style="position:static;padding:0;margin:0 0 12px;background:none">
         <button onclick="setAll(true)">Expand all</button>
         <button onclick="setAll(false)">Collapse all</button>
         ${onlyToggle('units',shownU.length,V.length,'properties')}
         <span class="tiny muted">${openN} of ${shownU.length} expanded</span></div>`:'')+
      (V.length
        ? (shownU.length?shownU.map(unitCard).join('')
           :`<div class="card"><h2>Nothing needs attention</h2><p class="muted" style="margin-bottom:0">All ${V.length} propert${V.length>1?'ies are':'y is'} inside their thresholds. Switch the filter off to see them anyway.</p></div>`)+hiddenBar()
        : emptyState())+
      `<div class="note">31&ndash;60 and 61&ndash;90 day occupancy is derived from PriceLabs' cumulative forward figures &mdash; a close approximation. The 0&ndash;30 row is exact.</div>`;
    shownU.filter(u=>isOpen(u.id)).forEach(drawChart);
  } else if(CUR==='cal'){
    document.getElementById('v-cal').innerHTML=calView();
    refreshAllDayBtns();
  } else if(CUR==='log'){
    renderLog();
  } else if(CUR==='config'){
    document.getElementById('v-config').innerHTML=configView();
  }
}

async function main(){
  try{
    errs.length=0;
    document.getElementById('loading').classList.remove('hide');
    const ld=await call('get_listing_data',{question:'base min max price and occupancy vs market for all listings',
      only_syncing_listings:false,skip_hidden:true});
    let listings=ld.data?.listings||[];
    const byCh=new Map();
    listings.forEach(l=>{
      const ab=(l.channel_listing_details||[]).find(c=>c.channel_name==='airbnb');
      const k=ab?ab.channel_listing_id:l.id;
      const prev=byCh.get(k);
      if(!prev||(!prev.push_enabled&&l.push_enabled))byCh.set(k,l);
    });
    listings=[...byCh.values()];

    // Load in parallel with a concurrency cap. Sequential loading is 3 calls per
    // property, so a 10-unit portfolio would take ~30 round-trips end to end.
    // PriceLabs allows 60 requests/minute, so 4 at a time stays well inside it.
    const LOAD_CONCURRENCY=CFG.loadConcurrency;
    const loaded=new Array(listings.length);
    let next=0, doneN=0;
    const lbl=document.getElementById('loading');
    // Paint each property as it arrives. With the rate limiter in play a large
    // portfolio takes over a minute end to end, and waiting for the last one
    // before showing the first is the difference between slow and broken.
    let painted=0;
    const worker=async()=>{
      while(true){
        const i=next++; if(i>=listings.length) return;
        try{ loaded[i]=await loadUnit(listings[i]); }
        catch(e){ errs.push(esc(listings[i].name)+' — failed to load'); }
        doneN++;
        UNITS=loaded.filter(Boolean);
        if(lbl) lbl.textContent=`Loading ${doneN} of ${listings.length} properties…`;
        if(UNITS.length&&Date.now()-painted>400){
          painted=Date.now();
          document.getElementById('loading').classList.add('hide');
          try{ renderAll(); }catch(e){}
        }
      }
    };
    await Promise.all(Array.from({length:Math.min(LOAD_CONCURRENCY,listings.length)},worker));
    UNITS=loaded.filter(Boolean);

    document.getElementById('loading').classList.add('hide');
    LOADED_AT=Date.now();
    document.getElementById('errs').innerHTML=errs.map(e=>`<div class="err">${e}</div>`).join('');
    if(UNITS.length){ STALE=null; saveCache(); }
    renderAll();                       // dashboard is usable from here

    // Background pass: market context and seasonal windows. Slow endpoints, and
    // nothing above depends on them, so they must never block first paint.
    (async()=>{
      const st=document.getElementById('stamp');
      if(st) st.innerHTML=(st.innerHTML||'')+' <span class="muted">· loading market context…</span>';
      for(const u of UNITS){
        try{ await enrichUnit(u); }
        catch(e){ u.enrich={market:e.message||'failed',health:e.message||'failed'}; }
      }
      LOADED_AT=Date.now(); saveCache(); renderAll();
      try{ NUDGE_HTML=await loadNudges(); if(CUR==='actions') renderAll(); }catch(e){}
    })();
  }catch(e){
    document.getElementById('loading').classList.add('hide');
    if(/tool not found|unknown tool|no such tool|not available/i.test(e.message||'')){
      document.getElementById('errs').innerHTML=
        `<div class="err"><strong>This dashboard can't find your PriceLabs connector.</strong>
         It's currently pointed at <code>${esc(PL)}</code>, which belongs to whoever set this copy up.
         Every PriceLabs connection gets its own id, so yours will differ.
         <div style="margin-top:8px">Open the <strong>Config</strong> tab and paste your own connector id, or ask Claude
         &ldquo;what is my PriceLabs MCP tool prefix?&rdquo; and enter what it reports.</div></div>`;
      renderAll(); return;
    }
    const down=TRANSIENT.test(e.message||'');
    const cached=loadCache();
    if(cached){
      UNITS=cached.units; STALE=cached.ts;
      document.getElementById('errs').innerHTML=
        `<div class="warnbox"><strong>PriceLabs isn't responding${down?'':' — '+esc(e.message)}.</strong>
         Showing your last good data from ${new Date(cached.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}.
         Figures may have moved since, and pushing changes won't work until the connection is back.
         <button class="stage" style="margin-left:6px" onclick="main()">Try again</button></div>`;
      renderAll();
    } else {
      document.getElementById('errs').innerHTML=
        `<div class="err"><strong>Couldn't reach PriceLabs.</strong> ${esc(e.message)}
         <br><span class="tiny">Their MCP connector is in beta and does go down. Nothing on your side is broken and no data is lost — wait a few minutes and try again.</span>
         <div style="margin-top:8px"><button class="stage" onclick="main()">Try again</button></div></div>`;
      renderAll();
    }
  }
}
function show(v){
  ['portfolio','actions','units','cal','log','config'].forEach(k=>{
    document.getElementById('v-'+k).classList.toggle('hide',k!==v);
    document.getElementById('tab-'+k).classList.toggle('on',k===v);
  });
  CUR=v; renderAll(); hideTip();
  window.scrollTo({top:0,behavior:'instant'});
}
['portfolio','actions','units','cal','log','config'].forEach(k=>document.getElementById('tab-'+k).onclick=()=>show(k));
document.getElementById('theme').onclick=toggleTheme;
document.getElementById('traytoggle').onclick=toggleTray;
/* Shadow the tab bar only once it's actually pinned, so it reads as floating.
   Purely cosmetic — never let it break the page if the DOM shape differs. */
try{
  const bar=document.querySelector&&document.querySelector('.bar');
  if(bar&&window.IntersectionObserver&&document.body.insertBefore){
    const probe=document.createElement('div');
    probe.style.cssText='position:absolute;top:0;height:1px;width:1px';
    document.body.insertBefore(probe,document.body.firstChild);
    new IntersectionObserver(([e])=>bar.classList.toggle('stuck',!e.isIntersecting)).observe(probe);
  }
}catch(e){}
document.getElementById('pushall').onclick=pushAll;
document.getElementById('clearall').onclick=()=>{if(confirm('Discard all staged changes?')){PENDING=[];renderTray();syncButtons()}};
main().then(()=>show('portfolio'));
</script>
