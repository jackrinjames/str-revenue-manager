<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revenue Manager</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;padding:20px 20px 130px;background:#f4f4f6;color:#1a1a1a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
h1{font-size:22px;margin:0 0 3px;letter-spacing:-.02em}
h2{font-size:16px;margin:0;letter-spacing:-.01em}
h3{font-size:11px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280}
.sub{color:#6b7280;font-size:13px;margin-bottom:18px}
.muted{color:#6b7280}.tiny{font-size:12px}.up{color:#15803d}.down{color:#b91c1c}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid #d4d4d8;background:#fff;border-radius:7px;cursor:pointer;color:#3f3f46}
button:hover:not(:disabled){background:#f4f4f5}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:#18181b;border-color:#18181b;color:#fff}
button.stage{font-size:12px;padding:4px 10px}
button.go{background:#15803d;border-color:#15803d;color:#fff;font-weight:600}
button.go:hover:not(:disabled){background:#166534}
button.warn{color:#b91c1c;border-color:#fecaca}
button.x{border:none;background:none;color:#a1a1aa;font-size:16px;line-height:1;padding:2px 6px}
button.x:hover{color:#3f3f46;background:#f4f4f5}
select,input[type=number]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #d4d4d8;border-radius:6px;font-variant-numeric:tabular-nums}
input[type=number]{width:86px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(16,16,20,.04)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.pill.mini{padding:0 5px;font-size:9.5px;letter-spacing:.03em;vertical-align:1px;margin-left:3px;font-weight:700}
.p-raise{background:#dcfce7;color:#15803d}.p-cut{background:#fee2e2;color:#b91c1c}
.p-hold{background:#f4f4f5;color:#52525b}.p-watch{background:#fef3c7;color:#a16207}
.p-broke{background:#450a0a;color:#fff}
.p-surge{background:#fef3c7;color:#a16207;border:1px solid #fde68a}
/* Recommendation buttons carry their direction in colour */
button.rec{padding:2px 8px;font-weight:600;font-variant-numeric:tabular-nums}
button.rec-raise{background:#dcfce7;border-color:#86efac;color:#15803d}
button.rec-raise:hover:not(:disabled){background:#bbf7d0}
button.rec-cut{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
button.rec-cut:hover:not(:disabled){background:#fecaca}
button.stage:disabled{opacity:1;background:#fafafa;border-color:#ebebed;color:#b4b4bb;cursor:default}
button.stage.ready{background:#18181b;border-color:#18181b;color:#fff;font-weight:600}
button.stage.ready:hover:not(:disabled){background:#000}
button.stage.staged{background:#dcfce7;border-color:#86efac;color:#15803d;font-weight:600}
button.stage.staged:hover:not(:disabled){background:#fecaca;border-color:#fca5a5;color:#b91c1c}
button.day-btn{min-width:66px}
/* Filter chips read as a control, not another action button */
button.filt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 13px;
  border:1px dashed #a1a1aa;border-radius:999px;background:#fff;color:#3f3f46;font-weight:500}
button.filt:hover:not(:disabled){background:#f4f4f5;border-color:#71717a}
button.filt .fdot{width:8px;height:8px;border-radius:50%;border:1.5px solid #a1a1aa;flex:none}
button.filt.on{background:#18181b;border:1px solid #18181b;color:#fff;font-weight:600}
button.filt.on .fdot{background:#4ade80;border-color:#4ade80}
button.filt .fmut{opacity:.6;font-weight:400}
button.filt:disabled{opacity:.5;cursor:default}
[data-theme="dark"] button.filt{background:#1e1e22;border-color:#55555f;color:#d4d4d8}
[data-theme="dark"] button.filt:hover:not(:disabled){background:#2a2a30}
[data-theme="dark"] button.filt.on{background:#e8e8ea;border-color:#e8e8ea;color:#0f0f11}
[data-theme="dark"] button.stage:disabled{background:#161619;border-color:#232329;color:#55555f}
[data-theme="dark"] button.stage.ready{background:#e8e8ea;border-color:#e8e8ea;color:#0f0f11}
[data-theme="dark"] button.stage.staged{background:rgba(34,197,94,.18);border-color:#166534;color:#4ade80}
[data-theme="dark"] button.rec-raise{background:rgba(34,197,94,.18);border-color:#166534;color:#4ade80}
[data-theme="dark"] button.rec-cut{background:rgba(239,68,68,.18);border-color:#7f1d1d;color:#f87171}
/* Season strip */
.season{display:flex;gap:1px;background:#e4e4e7;border:1px solid #e4e4e7;border-radius:9px;overflow:hidden;margin-bottom:14px;flex-wrap:wrap}
.season .sm{background:#fff;padding:9px 12px;flex:1 1 130px;min-width:0}
.season .sm.now{background:#f9fafb;box-shadow:inset 0 -3px 0 #18181b}
.season .sm .mn{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#6b7280;font-weight:600}
.season .sm .sv{font-size:14px;font-weight:600;letter-spacing:-.01em}
.season .sm .sd{font-size:11px;color:#6b7280}
[data-theme="dark"] .season{background:#2a2a30;border-color:#2a2a30}
[data-theme="dark"] .season .sm{background:#17171a}
[data-theme="dark"] .season .sm.now{background:#1e1e22;box-shadow:inset 0 -3px 0 #e8e8ea}
tr.row-surge>td:first-child{box-shadow:inset 3px 0 0 #d97706}
[data-theme="dark"] .p-surge{background:rgba(245,158,11,.18);color:#fbbf24;border-color:#78350f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:#e4e4e7;border:1px solid #e4e4e7;border-radius:9px;overflow:hidden;margin-bottom:14px}
.cell{background:#fff;padding:11px 13px}
.cell .k{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.cell .v{font-size:19px;font-weight:600;letter-spacing:-.02em}
.cell .n{font-size:11px;color:#6b7280;margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#6b7280;font-weight:600;padding:8px;border-bottom:1px solid #e4e4e7;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f4f4f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tr.booked td{background:#fafafa;color:#a1a1aa}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#f9fafb}
/* Action cards sit directly on the page background, so they need to read as
   surfaces in their own right rather than as a tint. */
.act{background:#fff;border:1px solid #e4e4e7;border-left:3px solid #d4d4d8;
  padding:12px 14px;margin-bottom:8px;border-radius:0 8px 8px 0;position:relative;
  box-shadow:0 1px 2px rgba(16,16,20,.04)}
.act.hi{border-left-color:#b91c1c;background:#fef7f7}
.act.md{border-left-color:#d97706;background:#fffbf5}
.act.lo{border-left-color:#a1a1aa}
.act .t{font-weight:600;margin-bottom:2px;padding-right:26px}
.act .w{color:#52525b;font-size:13px}
.act .u{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-bottom:4px}
.act .do{margin-top:9px}
.act .dis{position:absolute;top:8px;right:8px}
.ctl{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:14px;background:#fafafa;border:1px solid #e4e4e7;border-radius:9px;margin-bottom:12px}
.chart{height:210px;position:relative;margin-top:6px}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px 14px;border-radius:9px;margin-bottom:11px;font-size:13px}
.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:12px 14px;border-radius:9px;margin-bottom:11px;font-size:13px}
.warnbox{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px 14px;border-radius:9px;margin-bottom:11px;font-size:13px}
.load{color:#6b7280;padding:36px 0;text-align:center}
.hide{display:none}
.note{background:#fff;border:1px solid #e4e4e7;border-radius:9px;padding:12px 14px;font-size:12.5px;color:#52525b;margin-top:14px}
.card .note{background:#f9fafb}   /* inset when nested, surface when standalone */
.ovr{background:#eef2ff;color:#3730a3;padding:1px 7px;border-radius:5px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(12px);bottom:24px;z-index:80;
  display:flex;align-items:center;gap:10px;background:#18181b;color:#f4f4f5;padding:10px 14px;border-radius:10px;
  font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;visibility:hidden;transition:opacity .15s,transform .15s}
#toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
#toast button{background:#f4f4f5;border-color:#f4f4f5;color:#18181b;font-weight:600}
#toast button:hover{background:#fff}

/* tooltips — rendered into a single fixed-position node on <body> so no
   ancestor's overflow:hidden or stacking context can clip them */
.tip{display:inline-flex;align-items:center;gap:3px;cursor:help;border-bottom:1px dotted #a1a1aa}
.tip .i{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;
  background:#e4e4e7;color:#52525b;font-size:9px;font-weight:700;font-style:normal;text-transform:none;letter-spacing:0;flex:none}
.tip:hover .i,.tip:focus .i{background:#18181b;color:#fff}
#tt{position:fixed;z-index:9999;width:300px;max-width:calc(100vw - 24px);
  background:#18181b;color:#e4e4e7;padding:11px 13px;border-radius:9px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:12.5px;font-weight:400;line-height:1.5;text-align:left;
  white-space:normal;text-transform:none;letter-spacing:0;word-break:normal;
  box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
#tt.on{opacity:1;visibility:visible}
#tt b{color:#fff;display:block;margin-bottom:4px;font-size:13px}
#tt em{color:#a5b4fc;font-style:normal;display:block;margin-top:7px}

/* ---------- status colour system ----------
   green = ahead / healthy, amber = watch, red = behind / broken, grey = neutral */
.s-good{background:#f0fdf4}.s-warn{background:#fffbeb}.s-bad{background:#fef2f2}.s-dead{background:#fafafa}
.cell.s-good{box-shadow:inset 3px 0 0 #16a34a}
.cell.s-warn{box-shadow:inset 3px 0 0 #d97706}
.cell.s-bad{box-shadow:inset 3px 0 0 #dc2626}
td.s-good{color:#15803d;font-weight:600}
td.s-warn{color:#a16207;font-weight:600}
td.s-bad{color:#b91c1c;font-weight:600}
tr.row-bad>td:first-child{box-shadow:inset 3px 0 0 #dc2626}
tr.row-warn>td:first-child{box-shadow:inset 3px 0 0 #d97706}
tr.row-good>td:first-child{box-shadow:inset 3px 0 0 #16a34a}
.bignum{font-variant-numeric:tabular-nums}

/* ---------- responsive ---------- */
/* ---------- sticky navigation ----------
   The tab bar pins to the top so you can switch views from the bottom of a long
   table. Table headers pin inside their own scroll region — a sticky header can
   only stick to its nearest scrolling ancestor, so the region needs a height. */
.bar{position:sticky;top:0;z-index:45;background:#f4f4f6;
  padding:10px 0 10px;margin:0 0 14px;border-bottom:1px solid transparent}
.bar.stuck{border-bottom-color:#e4e4e7;box-shadow:0 4px 12px -8px rgba(16,16,20,.35)}
[data-theme="dark"] .bar{background:#0f0f11}
[data-theme="dark"] .bar.stuck{border-bottom-color:#2a2a30}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
/* Long tables get their own bounded, scrollable region with a pinned header. */
.scroll.tall{max-height:min(68vh,720px);overflow:auto;border:1px solid #e4e4e7;border-radius:9px}
.scroll.tall thead th{position:sticky;top:0;z-index:20;background:#fff;
  box-shadow:inset 0 -1px 0 #e4e4e7}
[data-theme="dark"] .scroll.tall{border-color:#2a2a30}
[data-theme="dark"] .scroll.tall thead th{background:#17171a;box-shadow:inset 0 -1px 0 #2a2a30}
.scroll table{min-width:560px}
.scroll.wide table{min-width:820px}
/* Calendar: let headers wrap onto two lines instead of forcing wide columns */
.scroll.cal table{min-width:600px;table-layout:fixed}
.scroll.cal th{white-space:normal;line-height:1.25;vertical-align:bottom}
.scroll.cal table{min-width:760px}
.scroll.cal th:nth-child(1){width:14%}
.scroll.cal th:nth-child(2),.scroll.cal th:nth-child(3),.scroll.cal th:nth-child(4),
.scroll.cal th:nth-child(5),.scroll.cal th:nth-child(6),
.scroll.cal th:nth-child(7),.scroll.cal th:nth-child(8){width:9.5%}
.scroll.cal td{padding:8px 7px}
.scroll.cal .tip{display:inline}
.scroll.cal .tip .i{vertical-align:middle}

@media (max-width:760px){
  body{padding:14px 12px 150px;font-size:15px}
  h1{font-size:19px}
  .sub{font-size:12.5px;margin-bottom:14px}
  .card{padding:14px;border-radius:10px}
  .bar{gap:6px}
  .bar button{flex:1 1 auto;min-width:calc(50% - 6px);text-align:center}
  .bar #vcount,.bar #stamp{flex-basis:100%;margin-left:0!important;text-align:left}
  .grid{grid-template-columns:1fr 1fr}
  .cell .v{font-size:17px}
  .ctl{gap:10px;padding:12px}
  .ctl label.f{flex:1 1 calc(50% - 10px)}
  .ctl input[type=number]{width:100%}
  .ctl button{flex:1 1 100%}
  .chead{gap:8px}
  .chead h2{font-size:15px}
  select{max-width:100%}
  #tt{width:min(300px,calc(100vw - 24px))}
  #tray{padding:12px;max-height:60vh}
  .pend{flex-wrap:wrap}
  .pend .chg{flex-basis:100%;font-size:12px;color:#6b7280}
  .act .t{padding-right:30px}
  th,td{padding:8px 7px}
}
@media (max-width:420px){
  .grid{grid-template-columns:1fr}
  .bar button{min-width:100%}
}

/* ---------- calendar on small screens ----------
   A nine-column table can't be made readable at 390px however hard the widths
   are fought. Below 760px each night becomes its own stacked card instead. */
@media (max-width:760px){
  .scroll.cal,.scroll.cal.tall{overflow:visible;max-height:none;border:none}
  .scroll.tall{max-height:none;overflow:auto;border:none;border-radius:0}
  .bar{padding:8px 0}
  .scroll.cal table,.scroll.cal thead,.scroll.cal tbody,.scroll.cal tr,.scroll.cal td{display:block;width:auto;min-width:0}
  .scroll.cal thead{display:none}
  .scroll.cal tr{border:1px solid #e4e4e7;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .scroll.cal tr.booked{background:#fafafa;opacity:.65}
  .scroll.cal tr.row-surge{border-left:3px solid #d97706}
  .scroll.cal td{border:none;padding:3px 0;text-align:left!important;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .scroll.cal td:first-child{font-weight:700;font-size:15px;padding-bottom:7px;margin-bottom:5px;border-bottom:1px solid #f4f4f5}
  .scroll.cal td::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#6b7280;font-weight:600;flex:none}
  .scroll.cal td:first-child::before{content:none}
  .scroll.cal td:empty{display:none}
  .scroll.cal input[type=number]{width:96px}
  [data-theme="dark"] .scroll.cal tr{background:#17171a;border-color:#2a2a30}
  [data-theme="dark"] .scroll.cal tr.booked{background:#141417}
  [data-theme="dark"] .scroll.cal td:first-child{border-bottom-color:#212127}
}

/* ---------- dark theme ----------
   Applied via [data-theme="dark"] on <html>, so every rule below outranks the
   light defaults above without needing to touch them. */
html[data-theme="dark"]{color-scheme:dark}
[data-theme="dark"] body{background:#0f0f11;color:#e8e8ea}
[data-theme="dark"] .muted,[data-theme="dark"] .sub,[data-theme="dark"] h3,
[data-theme="dark"] .cell .k,[data-theme="dark"] .cell .n,[data-theme="dark"] th,
[data-theme="dark"] .act .u,[data-theme="dark"] .pend .u,[data-theme="dark"] label.f{color:#9a9aa4}
[data-theme="dark"] .load{color:#9a9aa4}

[data-theme="dark"] .card{background:#17171a;border-color:#2a2a30;box-shadow:none}

[data-theme="dark"] button{background:#1e1e22;border-color:#35353d;color:#d4d4d8}
[data-theme="dark"] button:hover:not(:disabled){background:#2a2a30}
[data-theme="dark"] button.on{background:#e8e8ea;border-color:#e8e8ea;color:#0f0f11}
[data-theme="dark"] button.go{background:#15803d;border-color:#15803d;color:#fff}
[data-theme="dark"] button.go:hover:not(:disabled){background:#16a34a}
[data-theme="dark"] button.warn{color:#f87171;border-color:#7f1d1d;background:#1e1e22}
[data-theme="dark"] button.x{background:none;border:none;color:#6b6b76}
[data-theme="dark"] button.x:hover{background:#2a2a30;color:#e8e8ea}
[data-theme="dark"] select,[data-theme="dark"] input[type=number]{background:#1e1e22;border-color:#35353d;color:#e8e8ea}
[data-theme="dark"] input:focus{outline-color:#e8e8ea}

[data-theme="dark"] .grid{background:#2a2a30;border-color:#2a2a30}
[data-theme="dark"] .cell{background:#17171a}
[data-theme="dark"] th{border-bottom-color:#2a2a30}
[data-theme="dark"] td{border-bottom-color:#212127}
[data-theme="dark"] tr.booked td{background:#141417;color:#6b6b76}
[data-theme="dark"] tr.clickable:hover td{background:#1e1e22}

[data-theme="dark"] .ctl{background:#1b1b1f;border-color:#2a2a30}
[data-theme="dark"] .note{background:#17171a;border-color:#2a2a30;color:#a8a8b2}
[data-theme="dark"] .card .note{background:#1b1b1f}
[data-theme="dark"] .act{background:#17171a;border-color:#2a2a30;border-left-color:#35353d;box-shadow:none}
[data-theme="dark"] .act .w{color:#a8a8b2}
[data-theme="dark"] .act.hi{background:#1f1416;border-left-color:#dc2626}
[data-theme="dark"] .act.md{background:#1f1a12;border-left-color:#d97706}
[data-theme="dark"] .err{background:#1f1416;border-color:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .ok{background:#121f17;border-color:#14532d;color:#86efac}
[data-theme="dark"] .warnbox{background:#1f1a12;border-color:#78350f;color:#fcd34d}

[data-theme="dark"] .p-raise{background:rgba(34,197,94,.16);color:#4ade80}
[data-theme="dark"] .p-cut{background:rgba(239,68,68,.16);color:#f87171}
[data-theme="dark"] .p-hold{background:#2a2a30;color:#a8a8b2}
[data-theme="dark"] .p-watch{background:rgba(245,158,11,.16);color:#fbbf24}
[data-theme="dark"] .p-broke{background:#7f1d1d;color:#fff}
[data-theme="dark"] .ovr{background:rgba(99,102,241,.18);color:#a5b4fc}

[data-theme="dark"] .up{color:#4ade80}[data-theme="dark"] .down{color:#f87171}
[data-theme="dark"] .s-good{background:rgba(34,197,94,.10)}
[data-theme="dark"] .s-warn{background:rgba(245,158,11,.10)}
[data-theme="dark"] .s-bad{background:rgba(239,68,68,.10)}
[data-theme="dark"] .s-dead{background:#1b1b1f}
[data-theme="dark"] td.s-good{color:#4ade80}
[data-theme="dark"] td.s-warn{color:#fbbf24}
[data-theme="dark"] td.s-bad{color:#f87171}

[data-theme="dark"] .tip{border-bottom-color:#6b6b76}
[data-theme="dark"] .tip .i{background:#2a2a30;color:#a8a8b2}
[data-theme="dark"] .tip:hover .i,[data-theme="dark"] .tip:focus .i{background:#e8e8ea;color:#0f0f11}
[data-theme="dark"] #tt{background:#2a2a30;border:1px solid #3f3f46}

[data-theme="dark"] #tray{background:#17171a;border-top-color:#2a2a30;box-shadow:0 -4px 24px rgba(0,0,0,.5)}
[data-theme="dark"] .pend{background:#1b1b1f;border-color:#2a2a30}

#tray.min{max-height:none}
#tray.min #traybody{display:none}
#tray.min .trayhead{margin-bottom:0}

<script>
/* The PriceLabs connector's tool prefix. This is per-account: every operator
   who connects PriceLabs gets their own server id, so it has to be settable
   rather than baked in, or a shared copy of this dashboard calls nothing. */
const PL_DEFAULT='mcp__PRICELABS_CONNECTOR_ID__';
let PL=localStorage.getItem('rm_connector')||PL_DEFAULT;
const setConnector=id=>{
  id=String(id||'').trim();
  if(!id) return;
  if(!id.startsWith('mcp__')) id='mcp__'+id;
  if(!id.endsWith('__')) id=id+'__';
  PL=id; localStorage.setItem('rm_connector',PL); main();
};
const errs=[];
let UNITS=[], PENDING=[], pid=0, NUDGE_HTML='', CAL_SEL='', STALE=null, LOADED_AT=null;
/* How far ahead to fetch, and how much of it the calendar shows. Surge dates
   like late December sit well outside a 90-day window. */
let CAL_HORIZON=365, CAL_DAYS=45;   /* seeded from CFG once it loads */
let HIDDEN=[], LOG=[], DISMISSED={};
try{HIDDEN=JSON.parse(localStorage.getItem('rm_hidden')||'[]')}catch(e){HIDDEN=[]}
try{LOG=JSON.parse(localStorage.getItem('rm_log')||'[]')}catch(e){LOG=[]}
try{DISMISSED=JSON.parse(localStorage.getItem('rm_dismissed')||'{}')}catch(e){DISMISSED={}}

const vis=()=>UNITS.filter(u=>!HIDDEN.includes(u.id));

/* "Only show what needs action" — kept per tab, since you might want the
   calendar filtered while still scanning the whole portfolio. */
let ONLY={portfolio:false,actions:false,units:false,cal:false};
try{ ONLY={...ONLY,...JSON.parse(localStorage.getItem('rm_only')||'{}')}; }catch(e){}
function toggleOnly(tab){
  ONLY[tab]=!ONLY[tab];
  localStorage.setItem('rm_only',JSON.stringify(ONLY));
  renderAll();
}
/* How many live actions does this property have right now? */
const liveCount=u=>actionsFor(u).filter(a=>!actedOn(a.key)&&!isDismissed(a.key)).length;
/* Does this night have anything to change? */
function nightActionable(u,d,orphanSet){
  if(d.booking_status||d.unbookable) return false;
  const rp=recPrice(u,d,orphanSet);
  if(rp&&!rp.already) return true;
  const rm=recMinStay(u,d,orphanSet);
  const cur=(u.ovr[d.date]&&u.ovr[d.date].min_stay!=null)?Number(u.ovr[d.date].min_stay):(d.min_stay??1);
  return !!(rm&&rm.n!==cur);
}
/* Label the action, not the state — "Show all" beside "Expand all" reads like
   another expand control and vanishes into a row of grey buttons. */
function onlyToggle(tab,shown,total,noun){
  const on=ONLY[tab], hidden=total-shown;
  return `<button class="filt${on?' on':''}" onclick="toggleOnly('${tab}')"
    title="${on?`Filtered to the ${shown} ${noun} with something to change. ${hidden} hidden — click to show everything again.`
            :`Hide the ${noun} that are already where they should be.`}">
    <span class="fdot"></span>${on?`Needs action only · ${shown}`:`Hide on-target ${noun}`}${on&&hidden?` <span class="fmut">${hidden} hidden</span>`:''}</button>`;
}
const saveH=()=>localStorage.setItem('rm_hidden',JSON.stringify(HIDDEN));
const saveL=()=>localStorage.setItem('rm_log',JSON.stringify(LOG.slice(0,300)));
const saveD=()=>localStorage.setItem('rm_dismissed',JSON.stringify(DISMISSED));
/* Anchor pins. PriceLabs recomputes `uncustomized_price` on every refresh, and
   on nights carrying your override it can come back lower than it was when you
   pushed. Measuring the next recommendation off the new, lower figure walks the
   price down every push → refresh cycle. So when you push a night we remember
   the anchor it was priced from, and keep using it while your override stands. */
let PINS={};
try{PINS=JSON.parse(localStorage.getItem('rm_pins')||'{}')}catch(e){PINS={}}
const saveP=()=>{ try{localStorage.setItem('rm_pins',JSON.stringify(PINS))}catch(e){} };
function addPins(uid,list){
  if(!uid||!list||!list.length) return;
  PINS[uid]=PINS[uid]||{};
  list.forEach(x=>{ if(x&&x.date&&x.anchor>0) PINS[uid][x.date]={...x,ts:Date.now()}; });
  saveP();
}

/* PriceLabs' MCP is in beta and does go down. Retry transient failures with
   backoff before giving up — a single blip shouldn't blank the dashboard. */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TRANSIENT=/not responding|timeout|timed out|network|502|503|504|econn|fetch failed|rate|429/i;

/* PriceLabs allows 60 requests a minute. A 20-property portfolio needs ~60 on
   the fast path alone and another ~40 to enrich, so requests are metered here
   rather than discovering the ceiling as a wall of 429s. */
const RATE_MAX=50, RATE_WINDOW=60000;
let rateLog=[];
async function rateGate(){
  for(;;){
    const now=Date.now();
    rateLog=rateLog.filter(t=>now-t<RATE_WINDOW);
    if(rateLog.length<RATE_MAX){ rateLog.push(now); return; }
    await sleep(Math.max(250,RATE_WINDOW-(now-rateLog[0])+50));
  }
}

async function call(tool,args,tries=3){
  await rateGate();
  let last;
  for(let i=0;i<tries;i++){
    try{
      const r=await window.cowork.callMcpTool(PL+tool,args);
      if(r.isError) throw new Error(r.content?.[0]?.text||'call failed');
      let d=r.structuredContent;
      if(!d){ try{d=JSON.parse(r.content[0].text)}catch(e){return {}} }
      return d;
    }catch(e){
      last=e;
      if(!TRANSIENT.test(e.message||'')||i===tries-1) throw e;
      await sleep(800*Math.pow(2,i));      // 0.8s, 1.6s
      await rateGate();
    }
  }
  throw last;
}

/* Last good snapshot, so an outage shows stale data rather than nothing. */
const CACHE_KEY='rm_cache';
/* Only the day fields the dashboard actually reads. The raw PriceLabs response
   carries twice as many, and at 20 properties × 365 nights the full payload
   comes to ~2.9MB against a ~5MB localStorage quota. */
const CACHE_DAY_FIELDS=['date','price','uncustomized_price','user_price','min_stay',
  'booking_status','unbookable','demand_desc','eff','anchor','vsAnchor'];
function trimUnit(u){
  const {_open,_acts,days,...rest}=u;
  return {...rest,days:(days||[]).map(d=>{
    const o={}; CACHE_DAY_FIELDS.forEach(k=>{ if(d[k]!==undefined) o[k]=d[k]; }); return o;
  })};
}
function saveCache(days){
  const horizon=days||CAL_HORIZON;
  try{
    const cut=Date.now()+horizon*864e5;
    const payload={ts:Date.now(),horizon,units:UNITS.map(u=>{
      const t=trimUnit(u);
      t.days=t.days.filter(d=>new Date(d.date+'T12:00:00')<=cut);
      return t;
    })};
    localStorage.setItem(CACHE_KEY,JSON.stringify(payload));
  }catch(e){
    // Quota exceeded — keep a shorter window rather than losing the fallback entirely.
    if(horizon>120){ saveCache(120); return; }
    if(horizon>60){ saveCache(60); return; }
    try{ localStorage.removeItem(CACHE_KEY); }catch(e2){}
  }
}
function loadCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(!c||!Array.isArray(c.units)||!c.units.length) return null;
    c.units.forEach(u=>{u._open={};u._acts=null});
    return c;
  }catch(e){ return null }
}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n};
const money=n=>'$'+Math.round(n).toLocaleString();
const iso=d=>d.toISOString().slice(0,10);
const fmtD=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysAgo=ts=>Math.max(0,Math.round((Date.now()-ts)/864e5));
const dayName=ts=>new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});

/* ---------- tooltips ---------- */
const T={
  occ:['Your occupancy','The share of nights already booked in this forward window. Cumulative, so "0–30 days" means the whole next 30 nights.','Read it against the market number beside it, never on its own. 40% is excellent in a dead season and alarming in peak.'],
  mkt:['Market occupancy','The same figure for your PriceLabs comp set — similar properties in your area, over the same window.','This is the benchmark. It moves with season and events, which is why a fixed occupancy target would mislead you.'],
  gap:['Gap','Your occupancy minus the market\'s, in percentage points.','This drives every recommendation. Inside ±8 you\'re priced right. Behind means cut, ahead means you left money on the table — you filled by being cheapest, not most wanted.'],
  mpi:['Market index (MPI)','How many times the market\'s occupancy you\'re capturing. 1.0× is exactly average.','Above 1.5× while sitting at your price floor is the classic underpricing signature — you\'re winning on price, not desirability. Below 1.0× means something is losing you bookings.'],
  adr:['ADR','Average nightly rate actually achieved on booked nights, excluding fees.','Rising occupancy with falling ADR is buying volume with rate. Watch them together — either alone can flatter you.'],
  base:['Base price','Your anchor rate. PriceLabs scales every night up or down from here by season, demand and day of week.','Change this to move the whole calendar. Use date overrides for individual nights instead.'],
  min:['Minimum price (floor)','The lowest PriceLabs may ever go, no matter how soft demand gets.','Your safety net — but if most open nights sit exactly here, the floor is setting your prices instead of the algorithm. Raise it and watch pace for a week.'],
  max:['Maximum price (ceiling)','The highest PriceLabs may go. Blank means no cap.','A cap set too low silently throttles your best dates. Leave it off unless you have a real reason.'],
  open:['Open nights','Unbooked, bookable nights in the next 90 days.','Your remaining inventory. Every one that passes unsold earns exactly nothing — which is why deep discounts beat empty nights near the date.'],
  floorN:['Nights at floor','How many open nights are priced at your minimum.','More than half means the floor is binding. PriceLabs wants to go lower and can\'t, or you\'ve set the floor above where its logic lands.'],
  orph:['Orphan gaps','1–2 night holes between bookings.','Nearly unsellable at normal rates and minimums — most guests want longer stays. Price them 20–30% down with a 1-night minimum. Anything beats zero.'],
  sync:['Price sync','Whether PriceLabs is actually pushing prices to your channels.','If this is off, nothing else here matters — you\'re hand-pricing. Fix it first.'],
  plprice:['Live price','The final rate for this night after everything — PriceLabs\' seasonality and demand adjustments <em>and</em> any override you\'ve set. Once you override a night, this shows your number, not theirs.','This is what a guest pays. It reflects PriceLabs\' last refresh, so a change you just pushed may not appear until they recompute.'],
  channel:['On channel','The last price PriceLabs saw live on your booking channel.','When this trails the Live price, the change hasn\'t reached Airbnb or Vrbo yet — either sync hasn\'t run or it\'s off. A persistent lag is worth investigating.'],
  raw:['PriceLabs base','PriceLabs\' own number for this night before their adjustments (last-minute discounts, far-out premiums, occupancy tweaks) and before anything you\'ve set. Your overrides never move it.','This is the anchor every recommendation is measured against, which is why it matters. Because your own changes can\'t shift it, targeting a position relative to this figure stays stable no matter how many times you push.'],
  ovr:['Your override','A date-specific price you set, which wins over everything PriceLabs calculates.','If a value shows here, your change is committed in PriceLabs — even when the calendar column beside it hasn\'t caught up yet.'],
  ovrMs:['Minimum stay','PriceLabs\' figure for this night in grey. If you\'ve set your own override it shows in blue, with theirs after the slash.','Amber means your override is longer than PriceLabs recommends — that usually means you\'re turning away bookings you could take. An empty blue value just means you haven\'t overridden this date.'],
  pills:['Date &amp; flags','Small letters after the date flag what\'s special about that night: <b>S</b> surge (PriceLabs sees a market-wide price or occupancy spike), <b>H</b> high demand, <b>G</b> good demand, <b>O</b> orphan (a 1–2 night gap between bookings), <b>FLR</b> next to a price means it\'s sitting on your floor.','Hover any flag for its specific meaning. S and O are the two worth acting on — surges want a premium, orphans want a discount and a 1-night minimum.'],
  priceRec:['Recommended price','This dashboard\'s suggestion for the night: your current effective rate adjusted by the window\'s pace gap, plus a surge premium where one applies, then clamped to your floor and ceiling. Orphan nights get the orphan discount instead.','Grey means nothing to change. A button means it differs — hover for the exact reasoning, click to fill the input. Every number here comes from your Config tab, so if you disagree with a recommendation, change the rule rather than the night.'],
  alos:['Average length of stay','Mean nights per booking, from your actual reservation history.','Short stays cost more per booking in turnover and cleaning. A rising minimum stay lifts this but costs occupancy — worth it only if RevPAN improves. Watch the median alongside the mean; one 30-night booking can flatter the average badly.'],
  bwin:['Booking window','Mean days between a booking being made and the guest checking in.','This is what makes a forward window actionable or not. If guests book five days out, a soft 60-day window is normal rather than a warning. Same-day bookings are a sign your last-minute pricing is doing work.'],
  revpanIdx:['RevPAN vs market','Your revenue per available night divided by the market\'s. 1.00 means you are matching the comp set; 0.61 means you are earning 39% less per available night than a typical comparable listing.','This is the closest thing to a single score for the property, and the metric your own playbook calls winning. Below 1.00, check which lever is behind — occupancy or rate — because the fix is different for each.'],
  revpan:['RevPAN','Revenue per available night — occupancy multiplied by rate. The composite outcome, and the only figure that can\'t be flattered by trading one against the other.','Pace tells you what to change; this tells you whether the last round of changes worked. Rising occupancy with falling RevPAN means you bought volume too cheaply. PriceLabs doesn\'t publish market RevPAN, so this compares you to your own trailing period rather than to the comp set.'],
  msRec:['Recommended minimum','This dashboard\'s own suggestion, from four rules: orphan gaps get 1 night, dates inside 14 days get at most 2, windows lagging market by 8+ points get at most 2, and strong weekends get at least 2. Otherwise PriceLabs\' figure stands.','A number in grey means nothing to change. A button means it differs — hover it for the reasoning, click to fill the input. This is arithmetic on your own rules, not a market forecast.'],
  pickup:['Bookings last 30 days','Distinct reservations picked up in the past 30 days.','Pace of demand rather than a snapshot. Zero over 30 days on a live listing is a problem no price change alone will fix.'],
  refresh:['Last refreshed','When PriceLabs last recomputed this listing\'s calendar.','Prices and overrides you push may not appear in the calendar until this updates. If it looks stale, run Recompute pricing.']
};
function tip(k,label){
  const t=T[k]; if(!t) return esc(label||k);
  return `<span class="tip" data-tip="${k}" tabindex="0">${label||t[0]}<i class="i">?</i></span>`;
}

const TT=document.getElementById('tt');
function showTip(el){
  const t=T[el.dataset.tip]; if(!t) return;
  TT.innerHTML=`<b>${t[0]}</b>${t[1]}<em>${t[2]}</em>`;   // tooltip copy may carry <b>/<em>
  TT.classList.add('on');
  TT.style.left='0px'; TT.style.top='0px';           // measure at a known origin
  const r=el.getBoundingClientRect(), b=TT.getBoundingClientRect();
  let left=r.left, top=r.top-b.height-8;
  if(top<8) top=r.bottom+8;                           // flip below when there's no room above
  left=Math.min(Math.max(8,left), window.innerWidth-b.width-8);
  TT.style.left=left+'px'; TT.style.top=top+'px';
}
const hideTip=()=>TT.classList.remove('on');
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]'); if(el) showTip(el);});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]')) hideTip();});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]'); if(el) showTip(el);});
document.addEventListener('focusout',hideTip);
window.addEventListener('scroll',hideTip,true);
document.addEventListener('scroll',hideTip,true);

/* ---------- configuration ----------
   Every number the engine uses lives here so it can be tuned per operator and
   per market without editing code. Defaults match revenue-rules.md. */
const CFG_DEFAULTS={
  profileName:'Balanced · 0–90 day window',
  marketNotes:'Seasonal desert market: compressed high season, deep summer trough. Late April is the cliff.',
  windows:[
    {key:'w1',label:'0–30 days',from:0,to:30,speed:'Act this week',mode:'act'},
    {key:'w2',label:'31–60 days',from:30,to:60,speed:'Adjust, re-check next week',mode:'act'},
    {key:'w3',label:'61–90 days',from:60,to:90,speed:'Watch only',mode:'watch'}
  ],
  gapHold:8, gapDeep:15, gapStructural:20,
  cutNearModest:10, cutNearDeep:15, cutFarModest:6, cutFarDeep:10,
  raiseModest:6, raiseNearStrong:12, raiseFarStrong:8, cutStructural:12,
  orphanMaxNights:2, orphanDiscount:25, orphanMinStay:1,
  msLastMinuteDays:14, msLastMinuteCap:2, msLagCap:2, msWeekendMin:2,
  floorBindPct:50, baseDriftPct:10, coolDays:7, dismissDays:30,
  mpiAhead:1.2, mpiFarAhead:1.8, mpiBehind:0.8,
  surgeUpliftPct:15,
  lowDemandPct:35, lowDemandCutCap:5,
  revpanBrakeCap:5, revpanBoostPct:5,
  autoCollapseAbove:3, calHorizon:365, calDays:45, loadConcurrency:4,
  stackWarnPct:15, seasonalWindows:true,
  /* Market profiles. The first entry is the fallback; later entries win when a
     property's city or state matches. Only keys present in `overrides` differ. */
  profiles:[
    {id:'default',name:'Default',match:{cities:[],states:[]},notes:'Applies to any property no other profile claims.',overrides:{}},
    {id:'desert',name:'Desert seasonal',match:{cities:['Scottsdale','Phoenix','Palm Desert','Palm Springs','Indio','La Quinta'],states:['AZ','Arizona'],},
     notes:'Compressed high season, deep summer trough, very short booking window in summer. Late April is the cliff.',
     overrides:{}}
  ]
};
/* DFD points PriceLabs actually reports, so derived windows snap to these. */
const DFD_POINTS=[7,15,30,45,60,90,120];
const snapDFD=n=>DFD_POINTS.reduce((a,b)=>Math.abs(b-n)<Math.abs(a-n)?b:a);
let CFG=structuredClone(CFG_DEFAULTS);
try{
  const saved=JSON.parse(localStorage.getItem('rm_cfg')||'null');
  if(saved&&typeof saved==='object') CFG={...CFG,...saved};
}catch(e){}
const saveCfg=()=>localStorage.setItem('rm_cfg',JSON.stringify(CFG));
CAL_HORIZON=CFG.calHorizon; CAL_DAYS=CFG.calDays;
if(!Array.isArray(CFG.profiles)||!CFG.profiles.length) CFG.profiles=structuredClone(CFG_DEFAULTS.profiles);

/* Which profile claims this property? Last matching wins; 'default' is fallback. */
function profileFor(l){
  const city=(l.city_name||'').trim().toLowerCase();
  const st=(l.state||'').trim().toLowerCase();
  let hit=CFG.profiles.find(p=>p.id==='default')||CFG.profiles[0];
  CFG.profiles.forEach(p=>{
    if(p.id==='default')return;
    const m=p.match||{};
    const c=(m.cities||[]).some(x=>String(x).trim().toLowerCase()===city);
    const s=(m.states||[]).some(x=>String(x).trim().toLowerCase()===st);
    if(c||s) hit=p;
  });
  return hit;
}
/* Effective config for a property: base values with its profile's overrides on top. */
function cfgFor(u){
  const p=u&&u.profile;
  return p&&p.overrides&&Object.keys(p.overrides).length ? {...CFG,...p.overrides} : CFG;
}

/* Seasonal booking windows, derived from PriceLabs' own per-month observation
   of how far ahead this market books. Snapped to the days-from-today points
   PriceLabs actually reports occupancy for. */
function deriveWindows(bookMax){
  if(!bookMax||!isFinite(bookMax)) return null;
  const a=snapDFD(Math.min(45,Math.max(14,Math.round(bookMax*2))));
  const b=snapDFD(Math.min(90,Math.max(a+15,a*2)));
  const c=snapDFD(Math.min(120,Math.max(b+30,b*2)));
  return [
    {key:'w1',label:`0–${a} days`,from:0,to:a,speed:'Act this week',mode:'act'},
    {key:'w2',label:`${a}–${b} days`,from:a,to:b,speed:'Adjust, re-check next week',mode:'act'},
    {key:'w3',label:`${b}–${c} days`,from:b,to:c,speed:'Watch only',mode:'watch'}
  ];
}
/* Windows in force for a property: its own edit, else derived, else config. */
function windowsFor(u){
  const c=cfgFor(u);
  if(u&&u.winOverride) return u.winOverride;
  if(u&&c.seasonalWindows&&u.derivedWindows) return u.derivedWindows;
  return c.windows;
}
const WINDOWS=u=>windowsFor(u);

/* Field definitions drive the config screen — label, help text, group. */
const CFG_FIELDS=[
  ['Pace thresholds', [
    ['gapHold','Hold band (± points)','Inside this many points of market, do nothing. The single most important number here — widen it to act less often, narrow it to act more.'],
    ['gapDeep','Deep-action threshold','Gap beyond which a cut or raise becomes aggressive rather than modest.'],
    ['gapStructural','Structural threshold (watch windows)','In watch-only windows, a gap worse than this stops being a timing problem and becomes a base-price problem.']
  ]],
  ['Rate moves (%)', [
    ['cutNearModest','Near-window modest cut','Applied when the near window lags market by more than the hold band.'],
    ['cutNearDeep','Near-window deep cut','Applied when the near window lags badly. Perishable inventory justifies going harder.'],
    ['cutFarModest','Far-window modest cut','Smaller because there is still time for demand to arrive.'],
    ['cutFarDeep','Far-window deep cut','For far windows lagging badly.'],
    ['raiseModest','Modest raise','When you are comfortably ahead of market.'],
    ['raiseNearStrong','Near-window strong raise','When you are far ahead near-in — you priced too low earlier.'],
    ['raiseFarStrong','Far-window strong raise','Same idea further out, applied more cautiously.'],
    ['cutStructural','Structural base cut','Suggested base-price reduction when a watch window is badly behind.']
  ]],
  ['Orphan nights', [
    ['orphanMaxNights','Max gap length counted as orphan','A gap this many nights or shorter is treated as near-unsellable at normal rates.'],
    ['orphanDiscount','Orphan discount (%)','How far below the current rate to price an orphan night.'],

function decide(win,gap,C,wins,mkOcc,rev){
  C=C||CFG;
  const w=(wins||C.windows).find(x=>x.key===win)||{};
  /* rev = {idx, adrBelow} — RevPAN against the market, and whether your rate is
     already under the comp set. Pace still decides direction; this stops the
     engine recommending a move that works against the scorecard. */
  const R = rev||{};
  const revAdjust = d => {
    if(!d.pct||R.idx==null) return d;
    if(d.pct<0 && R.idx<1 && R.adrBelow){
      const cap=Math.min(Math.abs(d.pct),C.revpanBrakeCap);
      return {...d, pct:-cap, range:cap+'%', braked:true,
        why:`RevPAN is ${(R.idx).toFixed(2)}× the market and your rate already sits below the comp set, so price isn't what's costing you here — cutting further would deepen the revenue gap, not close it. `+
            `Cut held to ${cap}%. Look at the listing itself: photos, reviews, minimum stays, amenities.`};
    }
    if(d.pct>0 && R.idx<1){
      const boosted=d.pct+C.revpanBoostPct;
      return {...d, pct:boosted, range:boosted+'%', boosted:true,
        why:`${d.why} You're also earning ${(R.idx).toFixed(2)}× the market's RevPAN despite leading on occupancy — the classic underpricing signature — so this is pushed to ${boosted}%.`};
    }
    if(R.idx>=1 && Math.abs(d.pct)<=C.gapHold){
      return {...d, why:`${d.why} RevPAN is already at ${(R.idx).toFixed(2)}× the market, so there's no urgency — this is a refinement, not a fix.`};
    }
    return d;
  };
  // A thin market is a different situation from losing share in a busy one.
  // Cutting into it protects nothing and costs rate, so cap how far it can go.
  const thin = mkOcc!=null && mkOcc < C.lowDemandPct;
  const cap0 = d => {
    if(!thin || !d.pct || d.pct>=0) return d;
    if(Math.abs(d.pct) <= C.lowDemandCutCap) return d;
    return {...d, pct:-C.lowDemandCutCap, range:C.lowDemandCutCap+'%', capped:true,
      why:`Market occupancy here is only ${mkOcc.toFixed(0)}% — the demand isn't there to win back with price. `+
          `Cut held to ${C.lowDemandCutCap}% instead of ${Math.abs(d.pct)}%: a deeper discount would mostly lower the rate on bookings you'd have taken anyway. `+
          `Put the effort into peak dates instead.`};
  };
  const cap = d => revAdjust(cap0(d));   // thin-market cap first, then the RevPAN brake/boost
  if(w.mode==='watch'){
    if(gap<=-C.gapStructural) return cap({act:'cut',sev:'md',pct:-C.cutStructural,range:C.cutStructural+'%',
      why:`More than ${C.gapStructural} pts behind this far out is structural, not timing. Lower the base price rather than papering over it with date overrides.`});
    return {act:'watch',sev:'lo',pct:null,why:'Inside normal range this far out. Booking curves here don\'t fill yet, and reacting early just erodes ADR.'};
  }
  const near=w.from===0;
  const cD=near?C.cutNearDeep:C.cutFarDeep, cM=near?C.cutNearModest:C.cutFarModest;
  if(gap<=-C.gapDeep) return cap({act:'cut',sev:'hi',pct:-cD,range:cD+'%',
    why:near?'Badly behind market on perishable inventory. Cut hard on unbooked nights, drop min-stay, and clear orphan gaps.'
            :'Badly behind market. Cut, but check min-stay first — a long minimum on soft midweek dates is often the real blocker.'});
  if(gap<=-C.gapHold) return cap({act:'cut',sev:'md',pct:-cM,range:cM+'%',
    why:near?'Behind market inside the booking window. Trim unbooked nights and confirm last-minute discounts are switched on.'
            :'Behind market. A modest trim should re-establish pace before these dates get perishable.'});
  if(gap<C.gapHold) return {act:'hold',sev:'lo',pct:null,why:`Tracking market inside ±${C.gapHold} pts. This is where you want to be.`};
  if(gap<C.gapDeep) return cap({act:'raise',sev:'md',pct:C.raiseModest,range:C.raiseModest+'%',
    why:near?'Ahead of market. Raise remaining unbooked nights — demand is there at a higher rate.'
            :'Ahead of market. Raise, and consider tightening min-stay to protect weekends.'});
  const rS=near?C.raiseNearStrong:C.raiseFarStrong;
  return cap({act:'raise',sev:'hi',pct:rS,range:rS+'%',
    why:'Far ahead of market. You\'re filling because you\'re cheapest, not because demand is uniquely strong. That\'s ADR left on the table.'});
}

async function pushAll(){

  PENDING=bad.map(x=>x.p); renderTray();

      if(L.revenue?.[d]!=null)u.rev[d]=L.revenue[d];
      if(L.stly_revpar?.[d]!=null)u.stlyRevpar[d]=L.stly_revpar[d];
      if(L.stly_adr?.[d]!=null)u.stlyAdr[d]=L.stly_adr[d];
      if(L.stly_occupancy?.[d]!=null)u.stlyOcc[d]=L.stly_occupancy[d];
    });
    // Trailing actuals — the scorecard half of the picture.
    u.trail={revpar:L.revpar?.['-90']??null, adr:L.adr?.['-90']??null,

/* Slow, optional market context. Runs after the dashboard is already on screen. */
async function enrichUnit(u){
  u.enrich={market:'pending',health:'pending'};
  const [nR,hR]=await Promise.allSettled([
    call('get_neighbourhood_data',{listing_id:u.id,pms_name:u.pms,question:'market surge dates and positioning'},1),
    call('get_listing_health_and_recommendations',{listing_id:u.id,pms_name:u.pms,question:'seasonal booking windows for this market'},1)
  ]);
  u.enrich.market = nR.status==='fulfilled' ? 'ok' : (nR.reason?.message||'failed');
  u.enrich.health = hR.status==='fulfilled' ? 'ok' : (hR.reason?.message||'failed');
  if(nR.status==='fulfilled'){
    const nd=nR.value.data?.data||{};
    u.comp=nd.summary_table||null;
    u.fpInsight=nd.fp_insights?.insight||''; u.occInsight=nd.occ_insights?.insight||'';
    (nd.fp_insights?.graph_data||[]).forEach(g=>{ if(g.date) u.surge[g.date]={type:'price',price:g.price}; });
    (nd.occ_insights?.graph_data||[]).forEach(g=>{ if(g.date) u.surge[g.date]={...(u.surge[g.date]||{}),type:u.surge[g.date]?'both':'demand',occ:g.occupancy}; });
    // The insight text names ranges; mark every night inside them, not just the peak.
    [u.fpInsight,u.occInsight].forEach(txt=>{
      const dates=[...String(txt).matchAll(/children="(\d{1,2}(?:st|nd|rd|th)\s+\w+\s+\d{4})"/g)].map(m=>new Date(m[1].replace(/(st|nd|rd|th)/,'')));
      for(let i=0;i+1<dates.length;i+=2){
        const a=dates[i],b=dates[i+1];
        if(isNaN(a)||isNaN(b)||b<a||(b-a)/864e5>10) continue;
        for(let dd=new Date(a);dd<=b;dd.setDate(dd.getDate()+1)){
          const k=iso(dd); if(!u.surge[k]) u.surge[k]={type:'range'};
        }
      }
    });
  }

  if(hR.status==='fulfilled'){
    const ms=hR.value.data?.data?.market_section||[];
    u.seasons=ms.map(row=>{
      const head=String(row[0]||'');
      const bw=String(row.join(' ')).match(/happen\s+(\d+)\s*[-–]\s*(\d+)\s*days/i);
      return {label:head,month:(head.match(/^[A-Za-z]+/)||[''])[0],
        season:(head.match(/\(([^)]+)\)/)||[,''])[1],
        bwMin:bw?Number(bw[1]):null, bwMax:bw?Number(bw[2]):null,
        detail:row.slice(1).join(' · ')};
    });
    const nowMonth=new Date().toLocaleDateString('en-US',{month:'long'});
    const cur=u.seasons.find(x=>x.month===nowMonth)||u.seasons[0];
    if(cur&&cur.bwMax) { u.derivedWindows=deriveWindows(cur.bwMax); u.derivedFrom=cur; }
  }
  return finishUnit(u);
}

/* Everything derived from whatever data we have so far. Safe to call twice —
   once on the fast path, again after enrichment adds windows and surge dates. */
function finishUnit(u){
  [7,30,60].forEach(d=>{ if(u.cum[d]==null&&u.snapOcc[d]!=null)u.cum[d]=u.snapOcc[d];
                         if(u.mkt[d]==null&&u.snapMkt[d]!=null)u.mkt[d]=u.snapMkt[d]; });
  const C=cfgFor(u);
  u.wins=WINDOWS(u).map(w=>{
    const disc=(o,a,b)=>(o[a]==null||o[b]==null)?null:(o[b]*b-o[a]*a)/(b-a);
    const mine=w.from===0?u.cum[snapDFD(w.to)]:disc(u.cum,w.from,w.to);
    const mk=w.from===0?u.mkt[snapDFD(w.to)]:disc(u.mkt,w.from,w.to);
    if(mine==null||mk==null)return{...w,na:true};
    return{...w,mine,mk,gap:mine-mk,d:decide(w.key,mine-mk,C,WINDOWS(u),mk,revPicture(u,w))};
  });
  // Effective price = your committed override when one exists, otherwise
  // PriceLabs' figure. Everything downstream must use this or a second
  // percentage change would compute off a stale pre-override rate.
  u.days.forEach(d=>{
    const o=u.ovr[d.date];
    d.eff = (o&&o.price&&o.price_type==='fixed') ? Number(o.price) : d.price;
    // The stable reference point. `price` absorbs your own overrides, so using it
    // as a base makes every push raise the base for the next one — a ratchet.
    // `uncustomized_price` is PriceLabs' own view and doesn't move when you push.
    d.anchor = Number(d.uncustomized_price)>0 ? Number(d.uncustomized_price) : d.price;
    // ...except it does move: PriceLabs recomputes it on refresh, and on nights
    // you've overridden it has come back lower. Hold the anchor you pushed from
    // while that override is still the one in place, for the cooling period.
    d.pinned=false; d.anchorLive=d.anchor;
    const pins=PINS[u.id], pin=pins&&pins[d.date];
    if(pin){
      const fresh=Date.now()-pin.ts < (C.coolDays||7)*864e5;
      const same=o&&o.price_type===pin.type&&Math.abs(Number(o.price)-Number(pin.price))<0.5;
      if(fresh&&same&&!d.booking_status){ d.anchor=pin.anchor; d.pinned=true; }
      // Expired, or a different override replaced ours: let go. A missing
      // override may just be a failed fetch, so leave the pin unused but kept.
      else if(!fresh||(o&&!same)){ delete pins[d.date]; }
    }
    d.vsAnchor = d.anchor>0 ? Math.round((d.eff-d.anchor)/d.anchor*100) : 0;
  });
  saveP();
  // Headline counts stay scoped to 90 days even though the calendar fetches
  // further out, so "open nights / 90d" keeps meaning what it says.
  const cut=Date.now()+90*864e5;
  const within90=u.days.filter(d=>new Date(d.date+'T12:00:00')<=cut);
  const open=within90.filter(d=>!d.booking_status&&!d.unbookable);
  u.openN=open.length;
  u.pinned=u.min!=null?open.filter(d=>d.eff<=u.min+0.5).length:0;
  u.ovrN=Object.keys(u.ovr).length;
  u.orphans=findOrphans(within90,C);
  u._open={};   // memo for openIn()
  u._acts=null; // memo for actionsFor()
  u.worst=u.wins.filter(w=>!w.na).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap))[0]||null;
  u.broken=u.push===false||u.min==null;
  return u;
}
function findOrphans(days,C){
  C=C||CFG;
  const out=[];let run=[];
  const flush=()=>{if(run.length&&run.length<=C.orphanMaxNights)out.push({dates:run.map(d=>d.date),n:run.length,from:run[0].date,to:run[run.length-1].date});run=[]};
  days.forEach(d=>{if(!d.booking_status&&!d.unbookable)run.push(d);else flush()});
  return out.slice(0,12);
}
function openIn(u,from,to){
  const k=from+'-'+to;
  if(u._open&&u._open[k])return u._open[k];
  const now=Date.now();
  const r=u.days.filter(d=>{
    if(d.booking_status||d.unbookable)return false;
    const off=(new Date(d.date+'T12:00:00')-now)/864e5;
    return off>from&&off<=to;
  });
  if(u._open)u._open[k]=r;
  return r;
}

/* ---------- portfolio triage ---------- */
/* Gap → severity. Ahead is green but a very large lead is amber: it means
   underpricing, which costs you money just as surely as lagging does. */
function gapClass(gap,C){
  C=C||CFG;
  if(gap<=-C.gapDeep)return 's-bad';
  if(gap<=-C.gapHold)return 's-warn';
  if(gap<C.gapHold)return 's-good';
  if(gap<C.gapDeep)return 's-warn';
  return 's-bad';
}
function gapCell(w,C){
  if(!w||w.na)return '<td class="r muted">—</td>';
  const g=(w.gap>=0?'+':'')+w.gap.toFixed(0);
  const cls=gapClass(w.gap,C);
  return `<td class="r bignum ${cls==='s-good'?'muted':cls}">${g}</td>`;
}

function emptyState(){

    <button class="go" onclick="main()">Try loading again</button></div>`;
  return `<div class="card"><h2>All ${UNITS.length} propert${UNITS.length>1?'ies are':'y is'} hidden</h2>
    <p class="muted">Nothing has been lost — hiding only filters this dashboard, and your PriceLabs data is untouched.</p>
    <button class="go" onclick="unhideAll()">Show all properties</button>${hiddenBar()}</div>`;
}
function portfolioView(){
  const V=vis();
  if(!V.length)return emptyState();
  const scoredAll=V.map(u=>{
    const live=actionsFor(u).filter(a=>!actedOn(a.key)&&!isDismissed(a.key));
    return {u,n:live.length,urgent:live.some(a=>a.sev==='hi')||u.broken};
  }).sort((a,b)=>(b.urgent-a.urgent)||(b.n-a.n)||a.u.name.localeCompare(b.u.name));
  const scored=ONLY.portfolio?scoredAll.filter(x=>x.n>0):scoredAll;
  if(ONLY.portfolio&&!scored.length) return `<div class="card"><h2>Nothing needs attention</h2>
    <p class="muted">All ${scoredAll.length} propert${scoredAll.length>1?'ies are':'y is'} tracking inside their thresholds with clean calendars.</p>
    ${onlyToggle('portfolio',0,scoredAll.length,'properties')}</div>`;

  const rows=scored.map(({u,n,urgent})=>{
    const st=u.push===false?'<span class="pill p-broke">Sync off</span>'
      :n===0?'<span class="pill p-raise">Clear</span>'
      :`<span class="pill ${urgent?'p-cut':'p-watch'}">${n} to do</span>`;
    const C=cfgFor(u);
    const rowCls=u.push===false||urgent?'row-bad':n?'row-warn':'row-good';
    const pinBad=u.min!=null&&u.openN&&u.pinned/u.openN>C.floorBindPct/100;
    return `<tr class="clickable ${rowCls}" onclick="goUnit('${u.id}')">
      <td><strong>${esc(u.name)}</strong><div class="tiny muted">${esc(u.city)}${u.profile&&u.profile.id!=='default'?` · ${esc(u.profile.name)}`:''}</div></td>
      <td>${st}</td>
      ${gapCell(u.wins[0],C)}${gapCell(u.wins[1],C)}${gapCell(u.wins[2],C)}
      <td class="r bignum ${(()=>{const f=u.revpar?.[90],t=(u.trail||{}).revpar;
        return (f==null||t==null||!t)?'muted':f>=t?'s-good':'s-bad';})()}"
        title="RevPAN for the next 90 days versus your trailing 90">${u.revpar?.[90]!=null?money(u.revpar[90]):'—'}</td>
      <td class="r bignum">${u.openN}</td>
      <td class="r bignum ${pinBad?'s-warn':'muted'}">${u.min!=null?u.pinned:'—'}</td>
      <td class="r bignum ${u.orphans.length?'s-warn':'muted'}">${u.orphans.length||'—'}</td>
      <td class="r bignum ${u.ovrN?'s-good':'muted'}">${u.ovrN||'—'}</td>
      <td class="r tiny ${u.min==null?'s-bad':'muted'}">${u.base!=null?money(u.base):'—'} / ${u.min!=null?money(u.min):'none'}</td>
      <td><button class="stage" onclick="event.stopPropagation();hideUnit('${u.id}')">Hide</button></td>
    </tr>`;
  }).join('');

  const totals=scoredAll.reduce((a,s)=>({n:a.n+s.n,urgent:a.urgent+(s.urgent?1:0)}),{n:0,urgent:0});
  return `<div class="card">
    <div class="chead"><div><h2>${V.length} propert${V.length>1?'ies':'y'}</h2>
      <div class="tiny muted">${totals.n?`${totals.n} action${totals.n>1?'s':''} across ${scoredAll.filter(s=>s.n).length} propert${scoredAll.filter(s=>s.n).length>1?'ies':'y'}`:'Nothing outstanding'}${totals.urgent?` · ${totals.urgent} need attention first`:''}</div></div>
      <div>${onlyToggle('portfolio',scored.length,scoredAll.length,'properties')}</div></div>
    <div class="scroll wide tall"><table><thead><tr>
      <th>Property</th><th>Status</th>
      <th class="r">${tip('gap','0–30')}</th><th class="r">31–60</th><th class="r">61–90</th>
      <th class="r">${tip('revpan','RevPAN')}</th>
      <th class="r">${tip('open','Open')}</th><th class="r">${tip('floorN','At floor')}</th>
      <th class="r">${tip('orph','Orphans')}</th><th class="r">${tip('ovr','Overrides')}</th>
      <th class="r">${tip('base','Base')} / ${tip('min','Floor')}</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    ${hiddenBar()}
    <div class="note">Sorted by what needs you most. Click any row to open that property. The three gap columns are your occupancy minus the market's, in points — bold means outside &plusmn;8 and therefore actionable.</div>
  </div>`;
}
function goUnit(id){
  CAL_SEL=id;
  COLLAPSED[id]=false; saveC();          // opening from the table should show the detail
  show('units');
  setTimeout(()=>{const el=document.getElementById('card-'+id); if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},80);

/* ---------- actions ---------- */
function actionsFor(u){
  if(u._acts)return u._acts;          // recomputed on every render otherwise
  const CFG=cfgFor(u);
  const acts=[];
  if(u.push===false){
    acts.push({unit:u.name,uid:u.id,sev:'hi',rank:-2,key:`${u.id}:sync`,
      title:'PriceLabs is not pushing prices to this listing',
      why:(u.lastPush?`Sync is off; last push was ${new Date(u.lastPush).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}. `:'Sync has never run for this property. ')
        +'You are hand-pricing this unit right now. Sync has to be switched on inside PriceLabs — this dashboard can\'t toggle it.'});
    if(u.min==null)acts.push({unit:u.name,uid:u.id,sev:'md',rank:-1,key:`${u.id}:nofloor`,
      title:'No minimum price set',
      why:'There is no floor configured, so once sync is on PriceLabs can discount without limit. Set a min on this card before turning pricing on.'});
  }
  u.wins.forEach(w=>{
    if(w.na||w.d.act==='hold'||w.d.act==='watch')return;
    const n=openIn(u,w.from,w.to).length;
    acts.push({unit:u.name,uid:u.id,sev:w.d.sev,key:`${u.id}:win:${w.key}`,
      title:`${LBL[w.d.act]} ${w.d.range} on unbooked nights, ${w.label}`,
      why:`${w.d.why} You're at ${w.mine.toFixed(0)}% vs market ${w.mk.toFixed(0)}% — a gap of ${w.gap>=0?'+':''}${w.gap.toFixed(0)} pts.`,
      btn:n?`<input type="hidden" id="pct-${u.id}-${w.key}" value="${w.d.pct}">
        <button class="stage" onclick="stageWindow(byId('${u.id}'),win('${u.id}','${w.key}'))">Stage ${w.d.pct>0?'+':''}${w.d.pct}% on ${n} nights</button>`:'',
      note:(()=>{const st=stackCheck(u,openIn(u,w.from,w.to),w.d.pct);return st?st.text:null})(),
      rank:(w.d.sev==='hi'?0:1)*10+(w.key==='w1'?0:w.key==='w2'?1:2)});
  });
  if(u.openN&&u.min!=null&&u.pinned/u.openN>CFG.floorBindPct/100){
    const mpi=u.mpi[90];
    acts.push({unit:u.name,uid:u.id,sev:(mpi&&mpi>CFG.mpiFarAhead)?'hi':'md',rank:5,key:`${u.id}:floor`,
      title:`Raise the ${money(u.min)} price floor`,
      why:`${u.pinned} of ${u.openN} open nights sit exactly at your minimum, so the floor is setting your price rather than the algorithm.`+
        (mpi&&mpi>CFG.mpiFarAhead?` You're filling at ${mpi.toFixed(1)}× the market rate — cheapest option, not most in demand. Test ${money(u.min*1.1)}–${money(u.min*1.2)} and watch pace for a week.`:''),
      btn:`<button class="stage" onclick="quickMin('${u.id}',1.15)">Stage floor at ${money(u.min*1.15)}</button>`});
  }
  if(u.base!=null&&u.recBase!=null&&Math.abs(u.base-u.recBase)/u.recBase>CFG.baseDriftPct/100){
    acts.push({unit:u.name,uid:u.id,sev:'md',rank:6,key:`${u.id}:base`,
      title:`Base price is ${u.base>u.recBase?'above':'below'} PriceLabs' recommendation`,
      why:`You're at ${money(u.base)}; PriceLabs recommends ${money(u.recBase)} from current comp-set data. The base scales everything else.`,
      btn:`<button class="stage" onclick="quickBase('${u.id}')">Stage base at ${money(u.recBase)}</button>`});
  }
  if(u.orphans.length){
    acts.push({unit:u.name,uid:u.id,sev:'md',rank:7,key:`${u.id}:orphans`,
      title:`${u.orphans.length} orphan gap${u.orphans.length>1?'s':''} in the next 90 days`,
      why:`Short gaps between bookings: ${u.orphans.slice(0,5).map(o=>o.n===1?fmtD(o.from):fmtD(o.from)+'–'+fmtD(o.to)).join(', ')}. Revenue on a night nobody can book is zero.`,
      btn:`<button class="stage" onclick="stageOrphans(byId('${u.id}'))">Stage 25% off, 1-night min</button>`});
  }
  u._acts=acts;
  return acts;
}
function buildActions(V){
  const all=V.flatMap(actionsFor);
  const done=[],dis=[],live=[];
  all.forEach(a=>{
    const e=actedOn(a.key);
    if(e){a.done=e;done.push(a)}
    else if(isDismissed(a.key))dis.push(a);
    else live.push(a);
  });
  live.sort((a,b)=>a.rank-b.rank);
  done.sort((a,b)=>b.done.ts-a.done.ts);

  // Group the moves by property so each carries its own market's season header.
  const card=a=>`<div class="act ${a.sev}">
    <button class="x dis" title="Dismiss" onclick="dismiss('${esc(a.key)}')">&times;</button>
    <div class="u">${esc(a.unit)}</div><div class="t">${a.title}</div><div class="w">${a.why}</div>
    ${a.note?`<div class="warnbox" style="margin-top:8px">${esc(a.note)}</div>`:''}
    ${a.btn?`<div class="do">${a.btn}</div>`:''}</div>`;

  const doneHtml=done.length?`<div class="card">
    <h3 style="margin-top:0">Already handled — ${done.length} paused</h3>
    ${done.map(a=>{const d=a.done,ago=daysAgo(d.ts),left=CFG.coolDays-ago;
      return `<div class="act lo" style="opacity:.8"><div class="u">${esc(a.unit)}</div>
        <div class="t" style="font-weight:500">${a.title}</div>
        <div class="w"><strong>Done ${dayName(d.ts)}</strong>${ago===0?' (today)':ago===1?' (yesterday)':` (${ago} days ago)`} — ${esc(String(d.change).replace(/<[^>]*>/g,''))}.
        ${left>0?`Hidden for another ${left} day${left>1?'s':''} so you can see whether pace responds.`:'Back tomorrow.'}
        <button class="stage" style="margin-left:6px" onclick="undoPause('${esc(a.key)}')">Un-pause</button></div></div>`}).join('')}
    <div class="note" style="margin-top:4px">Raising a price doesn't move occupancy the same day, so the underlying gap keeps reading the same way for a while. These are paused rather than recalculated.</div></div>`:'';

  const disHtml=dis.length?`<div class="card"><h3 style="margin-top:0">Dismissed — ${dis.length}</h3>
    ${dis.map(a=>`<div class="act lo" style="opacity:.7"><div class="u">${esc(a.unit)}</div>
      <div class="t" style="font-weight:500">${a.title}</div>
      <div class="w">Dismissed ${dayName(DISMISSED[a.key])}. Returns after 30 days.
      <button class="stage" style="margin-left:6px" onclick="undismiss('${esc(a.key)}')">Restore</button></div></div>`).join('')}</div>`:'';

  const byUnit=[...new Set(live.map(a=>a.uid))];
  const seasonHead=uid=>{
    const u=byId(uid), a=u&&seasonAdvice(u);
    if(!a||!a.line) return '';
    return `<div class="note" style="margin:14px 0 8px"><strong>${esc(u.name)} — ${esc(a.month)}, ${esc(a.season)}${a.bwMax!=null?`, books ${a.bwMin}–${a.bwMax} days out`:''}.</strong> ${esc(a.line)}</div>`;
  };
  const grouped=byUnit.length>1
    ? byUnit.map(uid=>seasonHead(uid)+live.filter(a=>a.uid===uid).map(card).join('')).join('')
    : (byUnit.length?seasonHead(byUnit[0]):'')+live.map(card).join('');
  const extras=ONLY.actions?'':doneHtml+disHtml;
  const tucked=done.length+dis.length;
  const filterBar=`<div class="bar" style="position:static;padding:0;margin:0 0 12px;background:none">
    <button class="filt${ONLY.actions?' on':''}" onclick="toggleOnly('actions')" ${tucked?'':'disabled'}
      title="${tucked?(ONLY.actions?`Paused and dismissed cards are hidden — ${tucked} of them. Click to show them again.`:'Hide the paused and dismissed sections below.')
        :'Nothing is paused or dismissed, so there is nothing to hide.'}">
      <span class="fdot"></span>${ONLY.actions?`Needs action only · ${live.length}`:'Hide paused &amp; dismissed'}${ONLY.actions&&tucked?` <span class="fmut">${tucked} hidden</span>`:''}</button>
    <span class="tiny muted">${done.length} paused · ${dis.length} dismissed</span></div>`;
  const head=live.length?filterBar+grouped
    :`<div class="card"><h2>${done.length||dis.length?'Nothing left to act on':'Nothing to change this week'}</h2>
      <p class="muted" style="margin-bottom:0">${done.length?'Everything flagged has been pushed. Give it a week and see how pace responds.':'Every window is tracking inside its hold band and the calendar is clean. Constant tinkering makes it impossible to tell what worked.'}</p>
      ${filterBar}</div>`;
  return head+extras;
}
function dismiss(k){DISMISSED[k]=Date.now();saveD();renderAll()}
function undismiss(k){delete DISMISSED[k];saveD();renderAll()}
function undoPause(k){
  if(!confirm('Bring this suggestion back?\n\nThe change stays in your log — this only un-hides the recommendation.'))return;
  LOG=LOG.map(e=>e.key===k?{...e,key:e.key+'~unpaused'}:e);saveL();renderAll();
}

/* ---------- unit cards ---------- */
function unitCard(u){
  const head=u.worst?u.worst.d.act:'hold';
  const open=isOpen(u.id);
  const liveN=actionsFor(u).filter(a=>!actedOn(a.key)&&!isDismissed(a.key)).length;
  const rows=u.wins.map(w=>{
    if(w.na)return `<tr><td>${w.label}</td><td colspan="5" class="muted">No data</td></tr>`;
    const n=openIn(u,w.from,w.to).length;
    const g=(w.gap>=0?'+':'')+w.gap.toFixed(0);
    return `<tr><td>${w.label}<div class="tiny muted">${w.speed}</div></td>
      <td class="r bignum">${w.mine.toFixed(0)}%</td><td class="r bignum muted">${w.mk.toFixed(0)}%</td>
      <td class="r bignum ${gapClass(w.gap,cfgFor(u))}">${g} pts</td>
      <td><span class="pill ${CLS[w.d.act]}">${LBL[w.d.act]}${w.d.range?' '+w.d.range:''}</span></td>
      <td class="r">${w.d.pct&&n?`<input type="number" id="pct-${u.id}-${w.key}" value="${w.d.pct}" style="width:60px">
        <button class="stage" onclick="stageWindow(byId('${u.id}'),win('${u.id}','${w.key}'))">Stage · ${n}</button>`:'<span class="tiny muted">—</span>'}</td></tr>`;
  }).join('');
  const recent=LOG.filter(e=>e.key&&e.key.startsWith(u.id+':')).sort((a,b)=>b.ts-a.ts)[0];

  return `<div class="card" id="card-${u.id}">
    <div class="chead">
      <div><h2>${esc(u.name)}</h2>
        <div class="tiny muted">${esc(u.city)}${u.beds?' · '+u.beds+' BR':''}${u.push===false?' · <strong class="down">SYNC OFF</strong>':''}${u.profile?` · profile <strong>${esc(u.profile.name)}</strong>`:''}${u.derivedFrom&&!u.winOverride&&cfgFor(u).seasonalWindows?` · windows sized to ${esc(u.derivedFrom.month)} (${u.derivedFrom.bwMin}–${u.derivedFrom.bwMax}d lead)`:''}${u.winOverride?' · custom windows':''}</div>
        ${recent?`<div class="tiny" style="color:#15803d;margin-top:3px">✓ You changed this ${daysAgo(recent.ts)===0?'today':daysAgo(recent.ts)===1?'yesterday':daysAgo(recent.ts)+' days ago'} — ${esc(recent.desc)}</div>`:''}
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="pill ${CLS[head]}">${LBL[head]}</span>
        <button class="stage" id="tog-${u.id}" onclick="toggleUnit('${u.id}')">${open?'Collapse':'Expand'}</button></div>
    </div>

    ${open?'':`<div class="tiny muted" style="margin-top:-6px">
      ${u.wins.filter(w=>!w.na).map(w=>`${w.label.replace(' days','d')}: <strong class="${w.gap>=0?'up':'down'}">${w.gap>=0?'+':''}${w.gap.toFixed(0)}</strong>`).join(' &nbsp;·&nbsp; ')}
      &nbsp;·&nbsp; ${u.openN} open &nbsp;·&nbsp; ${u.ovrN} override${u.ovrN===1?'':'s'}${liveN?` &nbsp;·&nbsp; <strong>${liveN} to do</strong>`:''}</div>`}

    <div class="ubody ${open?'':'hide'}" id="body-${u.id}">
    ${seasonStrip(u)}
    ${(()=>{
      const C=cfgFor(u);
      const mpi=u.mpi[90], adrD=(u.adr[90]!=null&&u.adrTrail)?u.adr[90]-u.adrTrail:null;
      const mpiC=mpi==null?'':mpi>=C.mpiFarAhead?'s-bad':mpi>=C.mpiAhead?'s-warn':mpi>=C.mpiBehind?'s-good':'s-bad';
      const adrC=adrD==null?'':adrD>=0?'s-good':adrD<-15?'s-bad':'s-warn';
      const pinRatio=u.min!=null&&u.openN?u.pinned/u.openN:0;
      const pinC=u.min==null?'s-bad':pinRatio>C.floorBindPct/100?'s-warn':'s-good';
      const pickC=u.pickup==null?'':u.pickup===0?'s-bad':u.pickup<2?'s-warn':'s-good';
      const mRev=marketRevpan(u,90), rIdx=(u.revpar?.[90]!=null&&mRev)?u.revpar[90]/mRev:null;
      return `<div class="grid">
      <div class="cell ${rIdx==null?'':rIdx>=1?'s-good':rIdx>=0.85?'s-warn':'s-bad'}">
        <div class="k">${tip('revpanIdx','RevPAN vs market')}</div>
        <div class="v bignum">${rIdx!=null?rIdx.toFixed(2)+'×':(u.revpar?.[90]!=null?money(u.revpar[90]):'—')}</div>
        <div class="n">${rIdx!=null?`${money(u.revpar[90])} vs market ${money(mRev)}`
          :u.revpar?.[90]==null?'no RevPAN data'

      <div class="cell ${adrC}"><div class="k">${tip('adr','ADR 90d')}</div><div class="v bignum">${u.adr[90]!=null?money(u.adr[90]):'—'}</div>
        <div class="n">${adrD!=null?`${adrD>=0?'+':'−'}${money(Math.abs(adrD))} vs trailing`:''}</div></div>
      <div class="cell ${mpiC}"><div class="k">${tip('mpi','Market index')}</div><div class="v bignum">${mpi!=null?mpi.toFixed(1)+'×':'—'}</div>

      <div class="cell"><div class="k">${tip('sync','Sync')}</div><div class="v">${u.push?'On':'Off'}</div>
        <div class="n">${u.refreshed?tip('refresh','refreshed '+new Date(u.refreshed).toLocaleDateString('en-US',{month:'short',day:'numeric'})):(u.push?'':'not pushing')}</div></div>
      <div class="cell ${pinC}"><div class="k">${tip('open','Open nights')}</div><div class="v bignum">${u.openN}</div>

      <div class="cell ${u.ovrN?'s-good':''}"><div class="k">${tip('ovr','Your overrides')}</div><div class="v bignum">${u.ovrN}</div>
        <div class="n">${u.ovrN?'committed in PriceLabs':'none set'}</div></div>
      <div class="cell ${pickC}"><div class="k">${tip('pickup','Bookings 30d')}</div><div class="v bignum">${u.pickup??'—'}</div>
        <div class="n">${u.lastBook?'last '+new Date(u.lastBook).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</div></div>
    </div>`})()}

    <h3>Price settings</h3>
    <div class="ctl">
      <label class="f">${tip('base','Base')}<input type="number" id="base-${u.id}" value="${u.base??''}"></label>

      <label class="f">${tip('max','Max')}<input type="number" id="max-${u.id}" value="${u.max??''}" placeholder="none"></label>
      <button onclick="stagePrices(byId('${u.id}'))">Stage price settings</button>
      <span class="tiny muted">${u.recBase!=null?'PriceLabs suggests base '+money(u.recBase):''}</span>
    </div>

    ${revpanCard(u)}

    <h3>Pace vs market</h3>
    <div class="scroll"><table><thead><tr><th>Window</th><th class="r">${tip('occ','You')}</th><th class="r">${tip('mkt','Market')}</th>
      <th class="r">${tip('gap','Gap')}</th><th>Call</th><th class="r">Apply %</th></tr></thead><tbody>${rows}</tbody></table></div>

    <h3>Ask PriceLabs</h3>
    <div class="ctl">
      <button onclick="runHealth('${u.id}')">Health check &amp; seasonal read</button>
      <button onclick="runMarket('${u.id}')">Market position &amp; comp set</button>
      <button onclick="loadStays('${u.id}')">Stays &amp; booking window</button>
      <button onclick="runDiagnose('${u.id}')">Why isn't this booking?</button>
    </div>
    <div id="diag-${u.id}"></div>
    <div id="stays-${u.id}"></div>

    <h3>Maintenance</h3>
    <div class="ctl">
      ${u.orphans.length?`<button onclick="stageOrphans(byId('${u.id}'))">Clear ${u.orphans.length} orphan gap${u.orphans.length>1?'s':''}</button>`:''}
      <label class="f">Clear overrides, next N days<input type="number" id="clr-${u.id}" value="30"></label>
      <button onclick="stageClear(byId('${u.id}'))">Stage clear</button>
      <button onclick="stageRefresh(byId('${u.id}'))">Recompute pricing</button>
      <button onclick="hideUnit('${u.id}')" title="Filter this property out of the dashboard. Nothing changes in PriceLabs.">Hide from dashboard</button>
    </div>
    <div class="chart"><canvas id="ch-${u.id}"></canvas></div>
    </div>
  </div>`;
}

/* collapse state — defaults to collapsed once the portfolio gets big enough
   that scrolling every expanded card would be slower than scanning */
let COLLAPSED={};
try{COLLAPSED=JSON.parse(localStorage.getItem('rm_collapsed')||'{}')}catch(e){COLLAPSED={}}
const saveC=()=>localStorage.setItem('rm_collapsed',JSON.stringify(COLLAPSED));
function isOpen(id){
  if(COLLAPSED[id]!==undefined) return !COLLAPSED[id];
  return UNITS.length-HIDDEN.length<=CFG.autoCollapseAbove;   // few: expanded. many: collapsed.
}
function toggleUnit(id){
  COLLAPSED[id]=isOpen(id); saveC();
  const u=byId(id), card=document.getElementById('card-'+id);
  if(!u||!card){renderAll();return}
  if(CHARTS[id]){try{CHARTS[id].destroy()}catch(e){} delete CHARTS[id]}
  card.outerHTML=unitCard(u);          // swap one card, not the whole tab
  if(isOpen(id)) setTimeout(()=>drawChart(u),20);
}
function setAll(open){
  vis().forEach(u=>COLLAPSED[u.id]=!open); saveC(); renderAll();
}
